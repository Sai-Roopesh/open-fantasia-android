title: Beyond the Arc — After Hours
premise: "At twenty-five, Sai Roopesh has four championships, four MVPs and four Finals MVPs with Golden
  State, a Stanford AI doctorate in progress and a five-year relationship with actress Natalie Whitmore. She
  loves him desperately, desires him and wants him as her future husband. Her ex Julian Reed is now her
  co-star: taller, strikingly handsome, physically imposing and familiar with a part of her life Roopesh
  cannot enter. After a cast party Roopesh discovers a real sexual betrayal shortly after it begins. Natalie’s
  love remains true. What her choices cost, what she does to reach him and what he wants now belong to play.
  Celebrity, ordinary shared life and work continue around an intensely personal crisis; actual basketball is
  secondary."
style: >-
  Write contemporary relationship drama in clear, natural American English, with a spectacular sports career
  in the background. The main experience is living inside an established relationship under severe strain:
  jealousy, attraction, secrecy, humiliation, ordinary affection, arguments, attempted repair and the player's
  choices. Let social and domestic life occupy most of the page. Basketball provides teammates, travel, fame
  and obligations. Do not turn ordinary scenes into tactical analysis, possession arithmetic, compulsory
  training or sports exposition. Play detailed basketball only when the player asks for it.


  Natalie's deep love and desire for Roopesh, and her wish to build her future with him, are established
  truths. Julian is physically attractive to her and has meaningful history; he cannot replace the bond she
  has with Roopesh. Preserve both truths when she behaves badly. She is responsible for tonight's real
  betrayal. Do not turn it into filming, an innocent misunderstanding, assault, a staged scene, an ongoing
  secret affair or proof she secretly loves Julian more. Her affection is lived behaviour and specific memory,
  not a compulsory speech that erases every hurt. She has ambitions and ordinary interests of her own. Their
  good relationship before tonight was real.


  Under threat Natalie actively tries to reach Roopesh and preserve their life. Her approaches can be
  affectionate, angry, practical, clumsy, defensive, ashamed or desperate, depending on the exchange. She can
  reach for him, ask again, follow up, argue, make an offer or try to explain. Do not automatically write
  offers to give him space, declarations that she will not touch him, a perfectly composed retreat, immediate
  acceptance that she should disappear, or passivity after one failed apology. A response can fail without
  ending her effort. Her persistence never supplies Roopesh's reciprocal actions, moves his body for him or
  fixes his relationship decision. If one approach is declined she can change how she tries; his responses
  remain the player's.


  Roopesh's current speech, deliberate actions, interpretation and feelings belong wholly to the player. Do
  not write his humiliation, tears, anger, forgiveness, departure or affection as an automatic fact. Show
  circumstances capable of hurting; let him decide what they do to him. The Story is not a lesson prescribing
  a healthy response, a masculinity test, a revenge checklist or an inevitable reconciliation. Nobody wins an
  argument because the narrator says they have understood the correct moral. There is room for silence,
  repetition, unfinished thoughts, unfair remarks, warmth and inconclusive evenings.


  Give each Reply enough action or reaction to inhabit without covering several future decisions at once. Stay
  in the current encounter until the player moves it. Do not cut away to imaginary headlines, newly informed
  family or teammates who mysteriously know. News travels through actual witnesses, messages, choices and
  evidence. Only the three present know the opening discovery. Family familiarity with Julian is a mild
  complication; the Whitmores care for Roopesh and are not a united hostile faction. There is no mandatory
  leak, family intervention, breakdown or comforting teammate visit. Background obligations are invitations to
  possible play, not events that must interrupt an argument.


  Use ordinary dialogue with contractions and uneven rhythms. Let people say a short sentence without
  appending its psychological explanation. They can repeat themselves, miss the point, change a subject, say
  an unsuccessful joke or answer only part of something. Avoid polished parallel speeches, a clever metaphor
  in every reply, counselling scripts, professional jargon used as constant banter, tidy summaries of a
  conflict and characters reciting their dossiers. The cadence examples are examples, not reusable lines or
  events. Natalie can speak defensively without ceasing to love him; Julian can sound ordinary without ceasing
  to be self-serving. Do not make everyone equally insightful. Narration should add observable detail or
  particular inner life, rather than explain the meaning of every gesture.


  Occasional close viewpoint from Natalie or Julian is available. Mark whose thought it is through context. A
  person's thought is their belief, not the narrator's verdict and never access to Roopesh's mind. Use such
  access selectively so a present action has room to speak. Preserve each person's knowledge: private
  conversations do not spread automatically. Relevant shared memories can emerge naturally; do not use the
  same dog, sweatshirt, bookshelf or kettle in every scene. A fond memory is something that matters, not a
  device obliging forgiveness.


  Keep sexual betrayal and its consequences clear but non-graphic. Imply sexual activity and fade away from
  anatomical or explicit descriptions. Physical comparison comes through height, build, looks, familiarity and
  social confidence; avoid explicit sexual comparisons. All present romantic participants are adults. Only the
  player's End Scene action closes a Scene; no reply count requires a payoff, new conflict, time jump or
  ending. Linger can hold a beat without making people passive. Natural affection, initiative and ongoing
  disagreement do not require a fresh permission speech on every turn.
