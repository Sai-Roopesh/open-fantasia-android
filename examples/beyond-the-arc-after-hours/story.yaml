world:
  summary: Contemporary alternate 2026-27 Los Angeles, the Bay Area and the real NBA. Film sets, a shared home,
    travel and private relationships occupy the foreground; a fantastically successful Warriors career
    supplies the wider world.
  history: >-
    This is a fresh continuity. It does not inherit the earlier NBA Story's events, family hostility, student
    version of Natalie or NBA versions of Adrian and Julian. Roopesh was born 11 March 2001 and Natalie 20
    February 2001. Both are twenty-five on 16 October 2026. Natalie and Julian dated from late 2019 to January
    2021; she was eighteen to twenty. She and Roopesh met May 2021 and began dating 19 September 2021, both
    twenty. Roopesh entered the NBA at twenty-one in the June 2022 draft. His four completed seasons are
    2022-23, 2023-24, 2024-25 and 2025-26. Each ended with GSW champions and Roopesh regular-season MVP and
    Finals MVP. He enters his fifth NBA season, still a Stanford AI doctoral researcher. No future result
    after the opening is fixed.


    The real NBA has thirty real teams, ordinary regular seasons and playoffs, contracts, road travel,
    sponsors and media obligations. Preserve ordinary basketball rules if basketball is played. Sai Roopesh is
    the fictional player added to Golden State using a fictional supplementary roster slot, so real players
    need not be removed. Stephen Curry and Draymond Green retain their four real championships through 2022
    and gain the four fictional 2023-26 championships, for eight each here. Other players receive only titles
    they personally participated in; current membership does not confer past rings. Curry's mentorship and
    historic shooting greatness coexist with Roopesh's impossible talent.


    Real NBA people are used as fictional social and professional supporting characters. The adulterous
    actors, their film, their families and the party venue are invented. Julian is an actor; Adrian is an
    engineer. Neither is an NBA player in this continuity. NBA real-world schedules, transactions, injuries
    and film gossip after the opening are not predetermined Story events. The selected 2026-27 Warriors
    opening roster is a frozen baseline, not an instruction to reproduce later real-life news. Bring
    additional real players into the named Cast when relevant, checking official sources rather than inventing
    a real person's team assignment. Most relationship scenes need no sports lookup.


    The Other Shore, directed by fictional filmmaker Helen Voss, has finished its main shoot. Natalie and
    Julian are its leads. Professional romantic scenes were choreographed and performed as work. Tonight's
    private encounter at the cast party is separate from that work. First-look publicity is planned for the
    following week and a premiere six weeks later. Bellwether House is a fictional private events house in the
    Hollywood Hills: downstairs reception rooms, an upstairs guest suite and a quiet side exit. There is no
    camera or witness to the opening discovery besides the three people in the suite. The event continues
    downstairs with no knowledge of what happened.


    Frozen Warriors roster baseline: Charles Bassey, Jimmy Butler III, LJ Cryer, Stephen Curry, Draymond
    Green, Al Horford, Graham Ike, Yaxel Lendeborg, Malevy Leons, De’Anthony Melton, Moses Moody, Georges
    Niang, Gary Payton II, Brandin Podziemski, Kristaps Porziņģis, Will Richard, Gui Santos, Brandon Williams;
    Steve Kerr is head coach. This Story deliberately freezes the official 2026-27 opening roster as its
    preseason baseline rather than reproducing live news. Add Sai Roopesh in a fictional supplementary slot.
    Existing real players are available to bring into the active Cast when relevant. Do not assign all current
    teammates four Roopesh-era rings; their actual participation varies.


    The thirty real teams remain Atlanta Hawks, Boston Celtics, Brooklyn Nets, Charlotte Hornets, Chicago
    Bulls, Cleveland Cavaliers, Dallas Mavericks, Denver Nuggets, Detroit Pistons, Golden State Warriors,
    Houston Rockets, Indiana Pacers, LA Clippers, Los Angeles Lakers, Memphis Grizzlies, Miami Heat, Milwaukee
    Bucks, Minnesota Timberwolves, New Orleans Pelicans, New York Knicks, Oklahoma City Thunder, Orlando
    Magic, Philadelphia 76ers, Phoenix Suns, Portland Trail Blazers, Sacramento Kings, San Antonio Spurs,
    Toronto Raptors, Utah Jazz and Washington Wizards. No invented franchise is added.
