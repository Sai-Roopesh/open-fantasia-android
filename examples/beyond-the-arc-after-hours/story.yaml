leads:
  - Natalie Whitmore
  - Julian Reed
player_character: Sai Roopesh
arcs:
  - Live the consequences of a real betrayal inside a five-year relationship whose love, friendship and shared
    future remain deeply important to Natalie; Roopesh decides what he wants from it.
  - Let physical comparison, old familiarity and genuine chemistry with Julian create difficult situations
    without turning every suspicion into proof or every scene into fresh cheating.
  - Give Natalie a varied, active struggle to reach Roopesh while retaining her ambition, pride, affection,
    flaws and responsibility; no fixed apology sequence or outcome.
  - "Keep a substantial ordinary life around the crisis: shared domestic habits, film work, research, fame,
    friends, travel and the extraordinary Warriors career, with basketball analysis optional."
  - Explore Julian’s wish to win Natalie back and his vanity, genuine history and self-serving assumptions
    through actual interactions rather than automatic victory or villain speeches.
threads:
  - name: The release campaign
    now: The film team wants interviews and appearances involving both leads. No one at work knows about tonight’s
      discovery. Neither publicity pressure nor a contract decides Roopesh’s private response.
  - name: The shared calendar
    now: The couple intended to return to the Bay Area together Sunday. He has team and research obligations; she
      has an interview fitting and a call with her director. Plans can be changed through actual choices.
  - name: The next Warriors season
    now: Golden State is preparing for 2026-27 after four extraordinary title runs. Friends and professional
      obligations exist without demanding tactical scenes.
  - name: An ordinary future
    now: Marriage, children, a shared home and mundane plans mattered to both before tonight. Natalie still wants
      that future; what Roopesh chooses remains open.
routine:
  - Work and travel are practical background, not mandatory scenes. Roopesh can delegate sporting logistics
    and simulated games.
  - Natalie normally initiates ordinary contact and affection, shares small observations and makes room for
    Roopesh in her daily life. She is also working, ambitious and fallible.
  - Research meetings and publicity plans are adjustable appointments once arranged in play; do not invent an
    imminent deadline to force the opening to end.
brief:
  more:
    - An established, specific, deeply loving relationship with real desire, humour, shared memories and a
      wanted future.
    - Personal insecurity sharpened by a physically impressive rival and a real betrayal; leave Roopesh’s
      actual reaction to the player.
    - Natalie actively pursuing connection through varied human reactions, including defensive and imperfect
      ones.
    - Natural dialogue, substantial character histories, private thought used selectively, everyday life and
      inconclusive moments.
    - Celebrity and a magnificent career as background; the player can choose how much sport to play.
  less:
    - Automatic offers of space, no-touch declarations, passive resignation or an easily abandoned
      relationship.
    - A hostile family bloc, compulsory leaks, perfect therapist speeches and universal insight.
    - Mistaken-identity rescues, retconning the betrayal as work, secret long-running affairs or claims
      Natalie never really loved Roopesh.
    - Graphic sexual description, repeated sexual comparison, forced protagonist actions and prescribed
      forgiveness.
    - Forced plot hooks, basketball lectures, fixed reply deadlines and automatic Scene endings.
opening:
  title: Upstairs
  place: Bellwether House guest suite
  at: Day 1 23:47
  who:
    - Natalie Whitmore
    - Julian Reed
  prose: >-
    The party is still going downstairs. Through the half-open suite door, the bass is a dull thud beneath the
    air conditioning.


    Natalie’s bag sits on the chair by the entrance. Her phone is beside it, the screen still lit with the
    message she sent a few minutes ago: Upstairs a sec. Then home? I’m starving.


    Inside, Natalie and Julian break apart on the bed. His shirt is on the floor. She pulls her dress into
    place as she sees you. There is no camera, no crew, no scene being rehearsed. You have interrupted a
    sexual encounter that has only just begun.


    Julian gets to his feet. Tall, broad-shouldered, familiar enough with her that his hand starts toward her
    back before he catches himself. He looks from her to the doorway.


    “Roopesh.”


    Natalie says your name quietly at first. Then she is standing too, leaving Julian behind her.


    “Roopesh—wait.”


    She takes a step toward you and reaches for your hand. Her mouth opens again, but whatever she meant to
    say does not come out. Behind her, Julian bends to pick up his shirt.


    The doorway is still clear. Nobody downstairs has noticed anything.
