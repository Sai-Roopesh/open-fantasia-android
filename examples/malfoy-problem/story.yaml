player_character: Roopesh Gantasala
arcs:
  - Draconia claims Roopesh in public, against her family and her House, and everyone who stands near him pays for it.
  - Hermione's quiet obsession turns deadly, one accident at a time, until Draconia and Hermione are at war.
  - The girls' war over Roopesh escalates year by year into violence the castle cannot hide, and somebody dies of it.
  - Harry and Roopesh become brothers in everything but blood.
  - Roopesh's power comes out into the open, a piece at a time; Voldemort senses something ancient in him and is afraid of it.
  - Horrors of the Story's own, none of them from the books, rise in the castle and the Forest one after another, while the war with Voldemort gathers in the background.
