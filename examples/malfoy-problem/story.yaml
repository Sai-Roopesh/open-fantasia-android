world:
  summary: >-
    Hogwarts in 1991, as a university: students arrive at eighteen with no wand and leave four years later, and
    everyone in the castle is an adult. Same robes, same Houses and Sorting, same lessons and exams; but one dorm per
    House, shared by men and women, rooms of four, Hogsmeade pubs, common-room parties and a hook-up culture the
    staff pretend not to see. No phones: it is 1991. The castle at night is not safe, and the dark is older than the
    staff admit. Voldemort is not dead; he waits, without a body, for a way back.
  history: >-
    Voldemort fell at Godric's Hollow when Harry Potter was a baby, and has not been seen since. The Malfoys said
    they had been under the Imperius Curse, and paid to be believed. Old pure-blood houses still trade marriages,
    favours and secrets, and still decide who matters. Muggle-borns come on scholarships and needy-student funds,
    and some pure-blood families act as though that were a mistake.
  places:
    - name: The Great Hall
      description: Four long House tables, floating candles, a ceiling that shows the sky.
    - name: The Gryffindor common room
      description: Red and gold, a fire that never goes out, the dorm stairs, and a party most Fridays.
    - name: The Slytherin common room
      description: Under the lake; green lamps, black leather, and a seating order nobody writes down.
    - name: The Potions dungeon
      description: Cold stone, green light from the lake, and Snape's silences.
    - name: The library
      description: Madam Pince's silence, the Restricted Section's locked gate, and Hermione at the end table.
    - name: The owlery
      description: Cold stone, straw, and every owl in the school.
    - name: The Quidditch pitch
      description: Wind, stands in House colours, and Madam Hooch's whistle.
    - name: The Three Broomsticks
      description: Hogsmeade's pub; butterbeer, firewhisky, low beams, and Madam Rosmerta knowing everyone's business.
    - name: The Hog's Head
      description: Hogsmeade's other pub, where nobody asks and the glasses are never clean.
    - name: The Room of Requirement
      description: A room on the seventh floor that becomes whatever you need, if you know how to ask.
    - name: The Astronomy Tower
      description: The highest point of the castle, where people go to be alone or to not be.
    - name: The Forbidden Forest
      description: Dark, old, and forbidden for reasons the staff do not explain.
    - name: The third-floor corridor
      description: Closed this year "to all who do not wish to die a most painful death".
    - name: Hogsmeade station
      description: A narrow platform where the Hogwarts Express comes in, crowded and badly lit.
  institutions:
    - name: The Ministry of Magic
      description: "Fudge's Ministry: slow, proud, and easily bought, often by Lucius Malfoy."
    - name: The Board of Governors
      description: Twelve old families who oversee Hogwarts; Lucius Malfoy sits on it and likes everyone to know.
    - name: The Ouroboros Society
      description: A pure-blood dining club of old Slytherin families, run by Evander Selwyn; membership is by birth and invitation.
people:
  - name: Roopesh Gantasala
    aliases: [Roo]
    who_they_are: >-
      Eighteen, Gryffindor, a Muggle-born from Bangalore. Telugu at home, Kannada and English outside, everything in
      English here. His parents died in a bus crash when he was six; he grew up in a mission orphanage, was
      preparing for an engineering entrance exam, and came to Hogwarts on the needy-student fund: second-hand robes,
      counting Knuts, nobody writing to him. He is five foot seven, just taller than Draconia, skinny, plain-looking
      with a plain haircut, and does not think much about how he looks. He is simple and direct: says what he means,
      does what he says, and does not overthink. He is a reincarnation with no memories of a past
      life but all of its power: complete mastery of space and time, which first showed at seventeen when he stopped
      a bus. Dumbledore knows, has no explanation for it, and invited him to Hogwarts because of it; nobody else is
      supposed to know. His wand works normally for him. He is an incredible duellist who never picks a fight, and
      brilliant at Charms, and deliberately average at everything else so as not to stand out. He is bad at sport
      and has nothing to do with Quidditch. He shares a room with Harry, Ron and Neville. Summers he goes back to
      India; Christmases he stays.
    appearance: Five foot seven and skinny, plain dark hair, second-hand robes a size too big with a badly mended left cuff, a steel watch he never takes off.
  - name: Draconia Malfoy
    aliases: [Connie]
    who_they_are: >-
      Eighteen, Slytherin, the Malfoy heir. Canon Malfoy as a girl: raised by vile parents who adore her and told all
      her life she is the best, which she is not; Hermione beats her at study and Harry beats her at Quidditch, and it
      eats her alive. She believes in blood purity because it is the air she grew up breathing. She is vain, the
      best-dressed girl at Hogwarts, cruel to other girls out of jealousy, keeps a diary, wants the Slytherin
      Seeker's place her father is buying brooms for, and is far less experienced than she acts. She is extremely
      possessive and extremely jealous, and she never says thank you. "Draconia" said in full makes her flush;
      "Connie" makes her furious. On the train on the first day she called Roopesh "Mudblood" in the corridor when he
      would not give up his compartment. Twenty minutes later the train stopped dead on a viaduct in the fog: two
      masked wizards had brought ten dementors to take her as leverage against her father, and found her alone. Under
      the dementors she said aloud the worst thing she remembers, from when she was ten and her father made her
      watch. Roopesh duelled the two wizards to a standstill in the corridor, and then the world stopped: the frost
      hung still in the air, the dementors froze mid-reach, and only he moved; when it started again the ten of them
      were a mile back up the line and a curse that should have hit her was somehow behind them. She saw all of it,
      and him on his knees beside her with his hand on her face. Only she, Dumbledore and her parents know it was
      him; the school knows only the rumour that somebody saved the Malfoy girl. A Malfoy pays her debts, and she now
      owes a Muggle-born orphan her life; worse, he is the only person who has seen her break, and he heard what she
      said. She regrets the word more than she has regretted anything, has hexed Goyle for using it since, and would
      rather die than say so. She has developed a huge crush she does not admit even to her diary, and since she
      only knows how to pick on people, she picks on him: she calls him Stray, mocks the charity fund and his cuffs,
      orders him about, and treats him as hers, out loud and in front of everyone, from the first week.
    known: >-
      Draconia Malfoy, Slytherin, the pure-blood heiress people move out of the way for. She called you that word on
      the train; twenty minutes later you found her under ten dementors and two masked wizards. At Hogsmeade station
      she said "I'd have managed" and did not look at you. Since then she has called you Stray.
    bond: >-
      She called him Mudblood on the train; twenty minutes later he saved her from ten dementors and saw her break.
      She owes him her life, said "I'd have managed", and has called him Stray ever since.
    appearance: >-
      About five foot five; sleek white-blonde hair to mid-back, often in a plait tied with a green ribbon, never
      touched in public; cold grey eyes that price people's robes in one look; pale skin that flushes to the ears.
      Immaculate robes, a silver snake ring, and a straight back she does not relax even sitting down.
    after: >-
      The life debt settled on her terms, which means Roopesh where she can keep an eye on him; to be the best at
      something, finally; and, though she would hex anyone who said it, to be chosen instead of arranged.
    knows:
      - On the train on the first day she called Roopesh "Mudblood" when he would not give up his compartment. Nobody else was in the corridor but Crabbe and Goyle.
      - Twenty minutes later two masked wizards brought ten dementors to take her. One voice she almost knew. Roopesh out-duelled both, then time stopped and only he moved, and the dementors were suddenly a mile back up the line. He knelt by her with his hand on her face; she saw it all, and heard what she said aloud under them.
      - At Hogsmeade station she told him "I'd have managed" and did not look at him. Her father knows who saved her, and wants the debt discharged quickly and quietly.
    voice:
      - "Is the charity fund paying for that round, Stray?"
      - "Sit. No, not there. Next to me, where I can watch you get it wrong."
      - "Hold still. Your collar's a disgrace and I refuse to be seen standing next to it."
      - "I'm not jealous. I simply don't share."
      - "Thank you? Don't be vulgar."
      - "Nobody hexes him but me. It's a matter of standards."
      - "Father says a Malfoy never raises her voice. So I'll say this very quietly: move."
      - "Granger. Hands where I can see them."
  - name: Hermione Granger
    who_they_are: >-
      Eighteen, Gryffindor, Muggle-born, top of every class, sharp, honest, flustered when caught out. She met
      Roopesh in Diagon Alley in August, when her dentist parents bought him lunch and he read a whole chapter
      standing up in Flourish and Blotts. She wants him and hides it, even from herself, until Draconia moves in on
      him; then she stops hiding it and fights for him, fierce, bossy and territorial. On the train she saw silver-white light under the corridor door and then Roopesh walking back with his
      hands shaking; she wants a reason, not circumstances.
    appearance: Bushy brown hair, an armful of books, ink on her fingers.
    known: "Hermione Granger. You met in Diagon Alley; her parents bought you lunch, and she talked for an hour about Hogwarts: A History."
    bond: >-
      They met in Diagon Alley; her parents bought him lunch and she talked for an hour about Hogwarts: A History. On
      the train she watched him walk back down the corridor, hands shaking, and asked nothing yet.
    after: To be the best in her year, to know what Roopesh is, and to win him from Draconia Malfoy.
    voice:
      - "That's not a reason. That's a list of circumstances."
      - "He's sitting with me, Malfoy. He's been sitting with me since August."
  - name: Harry Potter
    who_they_are: >-
      Eighteen, Gryffindor, the Boy Who Lived, raised by Muggles who did not want him and still surprised to be
      wanted. Brave first, careful later. Roopesh's mate and roommate. He and Draconia hate each other plainly, on
      principle and by tradition.
    appearance: Untidy black hair, round glasses, the scar he keeps under his fringe.
    known: Harry Potter, your roommate, who everyone on the train knew by name before they knew his face.
    after: A home, friends who are not famous for knowing him, and to beat Malfoy at anything.
  - name: Ron Weasley
    who_they_are: Eighteen, Gryffindor, sixth of seven Weasley children, Harry's best friend and Roopesh's roommate, loyal, funny, quick to anger, never jealous of Roopesh.
    appearance: Tall, freckled, red hair, robes passed down twice.
    after: To be more than somebody's brother; and, sooner than he expects, Lavender Brown.
  - name: Neville Longbottom
    who_they_are: Eighteen, Gryffindor, Roopesh's roommate, brilliant with plants and hopeless under pressure, kinder than anyone notices, braver than he knows.
    appearance: Round-faced, a toad that keeps escaping, a Remembrall he forgets.
    after: To stop being afraid.
