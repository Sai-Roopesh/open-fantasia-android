player_character: Roopesh Gantasala
arcs:
  - Draconia claims Roopesh early and loudly, against everything she was raised to be, and fights every girl who comes near him.
  - Draconia takes back the word she said on the train, in her own way and at real cost to her.
  - Hermione stops hiding what she feels once Draconia moves in, and the two of them go to war over him.
  - When the Triwizard Tournament comes, Fleur Delacour and Cho Chang want him too, and the fight over Roopesh gets bigger.
  - Whether the girls who want him end up sharing him, or fighting on, comes out of play, not plan.
  - Harry and Roopesh become brothers in everything but blood.
  - Roopesh keeps what he can do hidden, and it comes out only when he chooses; Voldemort senses something ancient in him and never works out what.
  - The books' great events happen year by year with Roopesh in the middle of them, and plots of the Story's own run between them, to Voldemort's defeat.
