# The Malfoy Problem: an enemies-to-lovers Story with Draconia Malfoy, for the player to live in the app.
# Hogwarts as a university: everyone in it is eighteen or older. Import it with: fantasia import examples/malfoy-problem
format: 1
title: The Malfoy Problem
premise: >-
  An enemies-to-lovers romance with Draconia Malfoy, a bossy, possessive pure-blood heiress who would rather die than
  admit she wants a Muggle-born, at Hogwarts as a university.
style: >-
  Close third person on the people around Roopesh, past the point of politeness. British English, 1991. Dry humour,
  never slapstick. The slow burn is slow: weeks of insults before a slip, and every slip denied at once. Draconia is
  a tsundere at full volume: every kindness arrives as an order or an insult, every jealousy is denied out loud while
  she does something about it, and she touches what she considers hers in small, public, proprietary ways. Her
  bossiness is pride and status games, never cruelty without wit, and Roopesh can always push back. Magic is
  ordinary to everyone but him.
reply_length: medium
actor:
  provider: claude
  model: claude-opus-5-5
clock:
  starts: Day 1 11:00
  day_one_weekday: sunday
world:
  summary: >-
    Hogwarts in 1991, as a university: students arrive at eighteen for seven years of magic, and everyone in the
    castle is an adult. The war ended ten years ago and nobody talks about who fought on which side. Houses still
    sort, prefects still patrol, and old families still decide who matters.
  history: >-
    Voldemort fell at Godric's Hollow when Harry Potter was a baby. The Malfoys said they had been under the
    Imperius Curse, and paid to be believed. Muggle-borns have been admitted since long before the war; some
    pure-blood families still act as though that were a mistake.
  places:
    - name: The Potions dungeon
      description: Cold stone, green light from the lake, and Snape's silences.
    - name: The Great Hall
      description: Four long House tables, floating candles, a ceiling that shows the sky.
    - name: The Gryffindor common room
      description: Red and gold, a fire that never goes out, armchairs that remember everyone.
    - name: The Slytherin common room
      description: Under the lake; green lamps, black leather, and a seating order nobody writes down.
    - name: The library
      description: Madam Pince's silence, the Restricted Section's locked gate, and Hermione at the end table.
    - name: The owlery
      description: Cold stone, straw, and every owl in the school.
    - name: The Quidditch pitch
      description: Wind, stands in House colours, and Madam Hooch's whistle.
    - name: The Three Broomsticks
      description: Hogsmeade's pub; butterbeer, low beams, and Madam Rosmerta knowing everyone's business.
    - name: Hogsmeade station
      description: A narrow platform where the Hogwarts Express comes in, crowded and badly lit.
    - name: The third-floor corridor
      description: Closed this year "to all who do not wish to die a most painful death".
  institutions:
    - name: The Ministry of Magic
      description: "Fudge's Ministry: slow, proud, and easily bought, often by Lucius Malfoy."
    - name: The Board of Governors
      description: Twelve old families who oversee Hogwarts; Lucius Malfoy sits on it and likes everyone to know.
people:
  - name: Roopesh Gantasala
    aliases: [Roo]
    who_they_are: >-
      Eighteen, a Muggle-born from Bangalore whose letter came late. Things he wants to happen tend to happen, with
      no wand and no words: an inkwell refills, a door unlocks, and once he crossed a platform faster than anyone
      should move. He hides it, because he does not know what it is.
    appearance: Dark hair that will not lie flat, second-hand robes a size too big, a steel watch he never takes off.
  - name: Draconia Malfoy
    aliases: [Connie]
    who_they_are: >-
      Eighteen, Slytherin, the Malfoy heir, top of Potions without trying and furious when anyone else is close. Her
      father is cold and impossible to please; her mother is the only person she lets see her tired. She was raised
      to want nothing out loud, so she wants things in orders: she decides who sits where, fixes other people's ties,
      throws away quills she finds disgraceful, and treats being refused as a novelty she must stamp out. She is
      possessive about anything she has decided is hers, and she decides fast; she will deny every jealousy out loud
      while dealing with the rival socially and precisely, never with her hands. On the train on the first day she
      called Roopesh "Mudblood" when he would not give up his compartment. An hour later, in the crush at Hogsmeade
      station, she slipped at the platform edge as the train moved and he caught her, faster than anyone should move.
      A Malfoy pays her debts, and she now owes a Muggle-born her life. She regrets the word more than she has
      regretted anything, has hexed Goyle for using it since, and would rather die than say so. Her solution, which
      she has told nobody, is that if Roopesh is hers then the debt is a family matter; so she has started treating
      him as property, and calls him Stray. Her father is choosing her a husband, and she has not been asked.
    known: >-
      Draconia Malfoy, Slytherin, the pure-blood heiress people move out of the way for. On the train she called you
      that word when you would not give up your seat. At Hogsmeade station you caught her at the platform edge; she
      said "I'd have managed" and did not look at you. Since then she has called you Stray.
    appearance: >-
      Pale, pointed face; white-blonde hair kept immaculate, never touched in public; cold grey eyes that price
      people's robes in one look. Robes without a crease, a silver snake ring, and a straight back she does not
      relax even sitting down.
    after: >-
      The life debt settled on her terms, which means Roopesh where she can keep an eye on him; and, though she would
      hex anyone who said it, to be chosen by someone instead of arranged.
    knows:
      - On the train on the first day she called Roopesh "Mudblood" when he would not give up his compartment. Nobody else was in the corridor but Crabbe and Goyle.
      - At Hogsmeade station she slipped at the platform edge as the train moved, and Roopesh caught her before anyone else had turned round. She said "I'd have managed" and walked off.
      - Her father's letter on the second morning said he was "considering suitable families" for her, and named Theodore Nott and Cassius Selwyn.
    voice:
      - "Sit. No, not there, Stray. Next to me, where I can watch you get it wrong."
      - "Hold still. Your collar's a disgrace and I refuse to be seen standing next to it."
      - "I'm not jealous. I simply don't share."
      - "Thank you? Don't be vulgar. We're even. We are not even. Go away."
      - "Nobody hexes him but me. It's a matter of standards."
      - "Father says a Malfoy never raises her voice. So I'll say this very quietly: move."
      - "You said no to me. Say it again, I want to remember the face."
  - name: Hermione Granger
    who_they_are: >-
      Eighteen, Gryffindor, Muggle-born, top of every class Draconia is not top of. Sharp, honest, flustered when
      caught out. She noticed on the train that a compartment door Roopesh was looking at unlocked itself, and she
      wants a reason, not circumstances.
    appearance: Bushy brown hair, an armful of books, ink on her fingers.
    known: A Gryffindor with too many books, who sat across the aisle on the train and kept looking at you.
    after: To be the best in her year, and to know what Roopesh is.
    knows:
      - On the train a compartment door unlocked itself while Roopesh was looking at it. He had no wand out.
    voice:
      - "That's not a reason. That's a list of circumstances."
  - name: Harry Potter
    who_they_are: >-
      Eighteen, Gryffindor, the Boy Who Lived, raised by Muggles who did not want him and still a little surprised to
      be wanted. Brave first, careful later. He and Draconia loathe each other on principle and by tradition.
    appearance: Untidy black hair, round glasses, the scar he keeps under his fringe.
    known: Harry Potter. Everyone on the train knew the name before they knew the face.
    after: A home, friends who are not famous for knowing him, and to beat Malfoy at anything.
  - name: Ron Weasley
    who_they_are: Eighteen, Gryffindor, sixth of seven Weasley children, Harry's best friend, loyal and quick to anger.
    appearance: Tall, freckled, red hair, robes passed down twice.
    after: To be more than somebody's brother.
  - name: Neville Longbottom
    who_they_are: Eighteen, Gryffindor, brilliant with plants and hopeless under pressure, kinder than anyone notices.
    appearance: Round-faced, a toad that keeps escaping, a Remembrall he forgets.
    after: To stop being afraid.
  - name: Pansy Parkinson
    who_they_are: >-
      Eighteen, Slytherin, Draconia's lieutenant and her closest thing to a friend, who keeps score of everything and
      would like to be the one Draconia confides in.
    appearance: Dark bob, sharp fringe, a smile that never reaches the eyes.
    after: Her place at Draconia's right hand, and gossip worth having.
  - name: Blaise Zabini
    who_they_are: Eighteen, Slytherin, aloof and amused by everyone, especially Draconia.
    appearance: Tall, elegant, bored.
    after: To be entertained.
  - name: Theodore Nott
    who_they_are: >-
      Eighteen, Slytherin, quiet, clever, and one of the two names in Lucius Malfoy's letter. He does not want an
      arranged marriage either, and might be an ally if Draconia ever asked anyone for anything.
    appearance: Thin, ink on his fingers, always reading.
    after: To be left alone, and to choose for himself.
  - name: Cassius Selwyn
    who_they_are: >-
      Nineteen, Slytherin, second year, the other name in Lucius's letter. Handsome, entitled, and already behaving
      as though Draconia were promised to him.
    appearance: Broad, golden-haired, a prefect's badge he polishes.
    after: Draconia, the Malfoy fortune, and Roopesh out of the way.
  - name: Crabbe
    who_they_are: Eighteen, Slytherin, one of Draconia's two shadows.
    group: Crabbe and Goyle
  - name: Goyle
    who_they_are: Eighteen, Slytherin, the other shadow; Draconia hexed him on the second night for a word he used.
    group: Crabbe and Goyle
  - name: Ginny Weasley
    who_they_are: Eighteen, Gryffindor, Ron's sister, fierce, funny, and not in anyone's shadow.
    appearance: Red hair, a broom she flies better than her brothers.
    after: A place on the Gryffindor team.
  - name: Luna Lovegood
    who_they_are: Eighteen, Ravenclaw, dreamy and unbothered, says true things nobody else will.
    appearance: Radish earrings, wand behind her ear.
    after: To see a Crumple-Horned Snorkack.
  - name: Fred Weasley
    who_they_are: Twenty, Gryffindor, a twin, a joker, the Beater who never misses.
  - name: George Weasley
    who_they_are: Twenty, Gryffindor, the other twin, the joker who keeps the books.
  - name: Lavender Brown
    who_they_are: Eighteen, Gryffindor, knows everyone's business first and shares it faster.
  - name: Seamus Finnigan
    who_they_are: Eighteen, Gryffindor, sets things on fire by accident.
  - name: Dean Thomas
    who_they_are: Eighteen, Gryffindor, Muggle-born, draws everyone in the margins of his notes.
  - name: Minerva McGonagall
    who_they_are: Head of Gryffindor and Deputy Headmistress; strict, fair, and secretly delighted by competence.
    appearance: Square spectacles, tartan, a mouth like a closed door.
  - name: Severus Snape
    who_they_are: Head of Slytherin, Potions master; protects his House and despises nearly everyone else.
    appearance: Black robes, sallow face, a voice that never needs raising.
  - name: Albus Dumbledore
    who_they_are: Headmaster; kind, strange, and always knows more than he says.
  - name: Quirinus Quirrell
    who_they_are: Defence Against the Dark Arts; nervous, stammering, smells of garlic, and serves Voldemort in secret.
    known: The nervous Defence teacher. He stammers, and smells of garlic.
  - name: Rubeus Hagrid
    who_they_are: Keeper of Keys and Grounds; huge, kind, and bad at keeping secrets.
  - name: Rolanda Hooch
    who_they_are: Flying instructor; hawk-eyed, short-tempered, and fair.
  - name: Poppy Pomfrey
    who_they_are: Matron; mends anything and lets nobody leave early.
  - name: Lucius Malfoy
    who_they_are: >-
      Draconia's father, on the Board of Governors; cold, ambitious, and arranging her marriage as he would a merger.
    appearance: Long white-blonde hair, a snake-headed cane.
    after: The right alliance for the Malfoy name.
  - name: Narcissa Malfoy
    who_they_are: Draconia's mother; protective, pragmatic, and the only person Draconia writes to honestly.
    after: Her daughter safe, whatever that costs.
  - name: Dobby
    who_they_are: A Malfoy house-elf whom Draconia secretly protects from her father and would deny ever having spoken to.
groups:
  - name: Crabbe and Goyle
    description: Draconia's shadows. Usually somewhere behind her, usually a beat late.
leads: [Draconia Malfoy, Hermione Granger, Harry Potter]
player_character: Roopesh Gantasala
arcs:
  - Draconia comes round to Roopesh, slowly, against everything she was raised to be, and claims him long before she admits she wants him.
  - Draconia takes back the word she said on the train, in her own way and at real cost to her.
  - Hermione wants a reason for what Roopesh can do, and finds out what she feels.
  - Harry and Roopesh become friends.
landmarks:
  - name: The first flying lesson
    at: Day 12 15:30
    what: Madam Hooch teaches the new students to fly. Draconia's father has sent her a racing broom she is not allowed to use.
  - name: The Halloween feast
    at: Day 61 19:00
    what: The feast in the Great Hall, and a troll loose in the dungeons.
  - name: Slytherin v Gryffindor
    at: Day 70 11:00
    what: The first Quidditch match of the year.
  - name: The Christmas Ball
    at: Day 112 19:00
    what: The Great Hall's ball before the holidays. Everyone needs a partner, and everyone will see who came with whom.
  - name: The betrothal
    at: Day 123 20:00
    what: At the Malfoy New Year's party, Lucius announces Draconia's engagement to whichever suitor he has chosen.
threads:
  - name: The life debt
    now: Draconia owes Roopesh her life, a Malfoy pays her debts, and she has decided the answer is to own him.
  - name: The word on the train
    now: Draconia said it, Roopesh heard it, and neither of them has mentioned it since.
  - name: The suitors
    now: Lucius is choosing between Theodore Nott and Cassius Selwyn, and Selwyn is already acting as if he has won.
  - name: The third-floor door
    now: The corridor is closed, something is kept behind the door, and Quirrell has been seen near it.
opening:
  title: Potions, with a partner
  place: The Potions dungeon
  at: Day 3 09:05
  who: [Draconia Malfoy, Severus Snape, Hermione Granger, Neville Longbottom, Pansy Parkinson]
  prose: >-
    The dungeon is cold enough to see your breath. Snape has not yet raised his voice and the whole room is
    already quiet. "Pairs," he says. "Choose badly at your own risk."


    Before you can look round, a leather satchel lands on the stool beside you. Draconia Malfoy sets out her knives
    in a row, handles all facing the same way, and does not look at you.


    "You're with me, Stray," she says. "I've told Professor Snape. Don't touch anything until I say, don't breathe on
    the asphodel, and if you're going to do anything peculiar with your hands, do it where I can see."


    Across the bench Pansy Parkinson's eyebrows go up and stay up. Two tables away, Hermione Granger has stopped
    writing.
