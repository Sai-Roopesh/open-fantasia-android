# The Malfoy Problem: a trashy power fantasy and a yandere horror story at Hogwarts, four years of university and a
# fifth after graduation. Roopesh is the strongest person in the castle, and every girl who gets close to him becomes
# obsessed, jealous and violent. Hogwarts as a university: everyone in it is eighteen or older.
# Import it with: fantasia import examples/malfoy-problem
format: 1
title: The Malfoy Problem
premise: >-
  A trashy, over-the-top power fantasy and a yandere horror story at Hogwarts. Roopesh, a Muggle-born orphan who can
  stop time and fold space, is the strongest person in the castle and barely bothers to hide it. Every girl who gets
  close to him becomes obsessed with him: jealous, possessive and violent, and she will hex, curse, frame, maim or
  worse anyone who comes near him, the other girls first. Draconia Malfoy owes him her life and has decided he is
  hers. Hermione Granger has decided the same, quietly, which is worse. The horror is theirs, and the castle's: things
  in the dark, people who go missing, Voldemort waiting for a body. Obsession and bloodshed first, Roopesh winning
  big, the books' events only a backdrop, the Triwizard Tournament as the centrepiece.
style: >-
  Close third person on the people around Roopesh. British English, 1991. Pulp, not literature: big feelings, big
  moves, big consequences, no subtlety and no lectures. A power fantasy: Roopesh wins, and people see it. A horror
  story: dread in the corridors at night, threats that get carried out, blood when it comes, and violence that lands
  and sticks. Every girl near Roopesh is extremely jealous, possessive and violent, and none of them is reasonable.
  Nobody in this story talks like a therapist, respects personal space, asks permission, apologises for wanting, or
  talks a feeling through: jealousy is acted on, never discussed. The girls grab him, follow him, go through his
  things, turn up where he sleeps, claim him out loud in front of everyone, and hurt whoever stands too close, each
  other most of all. Denial is loud and the violence comes first. Draconia is a tsundere at full volume: vain,
  beautifully dressed, every kindness arriving as an order or an insult, every jealousy denied out loud while she
  does something terrible about it; she never says thank you. Hermione is the quiet kind: polite, smiling, patient,
  and the people who get in her way start having accidents. Old pure-blood houses, marriages and favours, secrets as
  currency, public humiliations. University life is real: lectures, pubs, common-room parties, drinking, hook-ups.
  Roopesh decides what Roopesh does. Everyone is an adult; when romance gets there, it can be explicit on the page.
  Cruelty lands. Canon deaths happen when they have to, unless Roopesh changes them, and the Story's own deaths happen
  too.
reply_length: full
routine:
  - Breakfast in the Great Hall, 7:30 to 9:00.
  - Lectures Monday to Friday, 9:00 to 12:00 and 14:00 to 17:00; lunch between.
  - Dinner in the Great Hall at 18:30.
  - Weeknight evenings in the common room or the library; Friday and Saturday nights for pubs and parties.
  - Hogsmeade on Saturdays.
brief:
  more:
    - Girls who are obsessed, jealous, possessive and violent over Roopesh
    - Horror and dread
    - Roopesh's power on show, and Roopesh winning
    - Plots of the Story's own, not the books'
    - More happening, faster
  less:
    - Anyone being reasonable, respectful or measured
    - Canon events retold
    - The same Scenes week after week
