threads:
  - name: The girls' war
    now: Since the train, every girl who looks at Roopesh too long has had something happen to her, a hex in a corridor, a ruined essay, a fall on the stairs. Nobody has been caught, and nobody has said his name out loud.
  - name: The missing girl
    now: Eloise Midgen, a Hufflepuff who asked Roopesh to partner her in Charms on Monday, has not been seen since Wednesday night. The staff say she went home ill. Her trunk is still under her bed.
  - name: The life debt
    now: Draconia owes Roopesh her life, a Malfoy pays her debts, her father wants it discharged quickly and quietly, and she has decided the answer is to own him.
  - name: What happened on the train
    now: The school knows only that somebody saved the Malfoy girl. Draconia, Dumbledore and her parents know it was Roopesh; Hermione saw the light.
  - name: Who sent them
    now: Two masked wizards tried to take Draconia as leverage against Lucius. Lucius is looking for them, quietly, and so are they for whoever stopped them.
  - name: The word on the train
    now: Draconia said it, Roopesh heard it, and neither of them has mentioned it since.
  - name: The suitors
    now: Lucius is considering pure-blood heirs for Draconia; Evander Selwyn is already acting as if he has won.
  - name: The third-floor door
    now: The corridor is closed, something is kept behind the door, and Quirrell has been seen near it.
  - name: The Dark Lord waiting
    now: Voldemort has no body and wants one; the Philosopher's Stone is at Hogwarts this year.
opening:
  title: Freshers' Friday
  place: The Three Broomsticks
  at: Day 6 21:40
  who: [Draconia Malfoy, Pansy Parkinson, Crabbe, Goyle, Harry Potter, Ron Weasley, Hermione Granger, Fred Weasley, George Weasley]
  prose: >-
    The Three Broomsticks is shoulder to shoulder with first-years at the end of their first week, the windows
    steamed, the twins standing on a bench to buy a round for anyone who survived Snape. You are at the bar with a
    handful of Knuts counted out on the wood, working out whether they make a butterbeer.


    The crowd parts the way crowds part for one person. Draconia Malfoy, green ribbon in her plait, Pansy at her
    shoulder and Crabbe and Goyle a beat behind, stops beside you and looks at the coins.


    "Is the charity fund paying for that round, Stray?" she says, loud enough for the Slytherin end of the room.
    Then her eyes drop to your left cuff, and for half a second her voice changes. "Who mended that? It's been done
    with the wrong thread." She looks away at once, chin up. "Not that I noticed."


    The Ravenclaw girl who was laughing at your elbow a minute ago is suddenly coughing into her sleeve, and her
    butterbeer has turned black. Across the pub, Hermione has stopped talking mid-sentence, and she is smiling at
    Draconia.
