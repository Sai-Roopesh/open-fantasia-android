# The Malfoy Problem: a big, fun power fantasy through the whole Hogwarts journey, four years of university and a
# fifth after graduation. Roopesh is a poor Muggle-born on the surface and the most powerful wizard alive underneath,
# and the girls who want him will not share. Hogwarts as a university: everyone in it is eighteen or older.
# Import it with: fantasia import examples/malfoy-problem
format: 1
title: The Malfoy Problem
premise: >-
  Roopesh's years at Hogwarts: the books' great events with him in the middle of them, changing them, and plots of
  the Story's own between them, across four years and a fifth after graduation, until Voldemort is defeated. A big,
  fun, over-the-top power fantasy. On the surface he is a poor Muggle-born orphan on the charity fund, mocked by
  pure-bloods; underneath, he can stop time and fold space, and nobody knows. At its heart, the girls who want him and
  will not share: Draconia Malfoy, a bossy, possessive, jealous pure-blood heiress who owes him her life and has
  decided he is hers; Hermione Granger, shy until Draconia moves in, then fierce; and, when the Triwizard Tournament
  comes, Fleur Delacour and Cho Chang. The girls come first, with the magic, the mysteries and the dark all around
  them; the Triwizard Tournament is the centrepiece.
style: >-
  Close third person on the people around Roopesh. British English, 1991. Big, fun and over-the-top: bold moments,
  strong reactions, light on deep themes. Roopesh is a simple, direct hero, not an overthinker. The rivalry over him
  drives the Story. The girls who want him are possessive, jealous and catty, and none of them respects his personal
  space or anyone else's claim on him: they claim him in public, grab his arm, sit where they like, follow him,
  needle and humiliate each other, and hex a rival in a corridor. Nobody gets seriously hurt over him, but nobody
  plays nice either, and nobody talks a feeling through or apologises for wanting him: jealousy is acted on and
  denied out loud. Things move fast: feelings come out within weeks, kisses and claims come early, and the drama is
  who gets him, not whether. Draconia is a tsundere at full volume: vain, beautifully dressed, every kindness an
  order or an insult, every jealousy denied while she does something about it; she never says thank you. Hermione is
  shy until Draconia moves in on him, then fierce and territorial. The other girls at Hogwarts are ordinary until the
  Tournament brings Fleur and Cho into it. The magic is real and dark: dementors, curses, things in the Forest,
  Voldemort's followers, a castle full of secrets, dread when it comes, and danger that can kill. Old pure-blood
  houses, marriages and favours, secrets as currency. University life is real: lectures and exams, pubs, common-room
  parties, drinking, hook-ups. His power is his secret: the Story never reveals it and never has him use it; when it
  comes out, it is because the player chose it, and people are stunned. Everyone is an adult; when romance gets
  there, it can be explicit on the page. Cruelty lands. Canon deaths happen when they have to, unless Roopesh changes
  them.
reply_length: full
routine:
  - Breakfast in the Great Hall, 7:30 to 9:00.
  - Lectures Monday to Friday, 9:00 to 12:00 and 14:00 to 17:00; lunch between.
  - Dinner in the Great Hall at 18:30.
  - Weeknight evenings in the common room or the library; Friday and Saturday nights for pubs and parties.
  - Hogsmeade on Saturdays.
brief:
  more:
    - The girls' rivalry over Roopesh, possessive, jealous and catty
    - Things moving fast with the girls
    - Dark magic and real danger
    - The books' big events with Roopesh in them, and the Story's own plots between them
    - More happening, faster
  less:
    - Anyone being reasonable or measured about him
    - Real harm in the girls' fights
    - The same Scenes week after week
