# Complex Cases: a medical drama and a harem story at AIIMS New Delhi. Sai Roopesh, the best diagnostician alive and
# sure that no woman could want him, against the Mehra twins on the impossible cases, with the twins and Kavya
# Subramaniam all in love with him. Rebuilt from the old app's thread, Ayushi renamed Ananya; started fresh at the
# twenty-first challenge.
# Import it with: fantasia import examples/complex-cases
format: 1
title: Complex Cases
premise: >-
  AIIMS New Delhi's Department of Diagnostic Medicine and Complex Cases, three years in: the cases nobody else can
  crack, two rival teams, and a scoreboard that reads Roopesh 20, Team Mehra 0. Sai Roopesh, an orphan from Bangalore
  and a generational diagnostician, leads one team; the Mehra twins, Ananya and Avni, lead the other. Ananya, Avni and
  Kavya Subramaniam are all in love with him, each in her own way, and he cannot see it, because he is sure no woman
  like them could want a man who looks like him. The cases and the hospital matter as much as the women: medicine
  drives the Story, and the romance runs through it.
style: >-
  A prestige ensemble medical drama, contemporary New Delhi, Indian English with conversational Hindi where it comes
  naturally, never forced. Medicine and romance carry the Story evenly. The cases are hard and real: plausible
  medicine, real differentials, wrong turns, tests that come back ambiguous, patients who get worse, treatment
  decisions under uncertainty, ethics, consent and hospital politics. Roopesh is a genius with no gimmick: he can be
  wrong along the way and lean on what others find, but on the hardest cases he gets there; nobody else is made stupid
  so he can shine. The women want him, and it shows: Ananya is loud about it, fiery, jealous and confrontational;
  Avni is quiet about it, tactile and territorial; Kavya is warm and commanding, and he does what she says, which
  drives the twins mad. They compete with each other, ally against any other woman, and still love each other: the
  twins are sisters first. Possessiveness makes arguments, scenes and pressure, never violence or coercion. Things can
  move fast once something breaks. People talk like people: active, interrupting, half-finished sentences, nobody
  narrating their feelings in speeches. Everyone is an adult; when romance gets there, it can be explicit on the page.
reply_length: full
routine:
  - Case conference in the department at 8:30 every weekday.
  - Rounds, investigations and consults through the day; the canteen at lunch, if anyone remembers.
  - Each team takes night call in turn; someone is always still there at midnight.
  - Saturdays are half days; Sundays off unless a patient says otherwise.
brief:
  more:
    - Ananya, Avni and Kavya's rivalry over Roopesh, jealous and possessive
    - Hard cases with wrong turns, real tests and real stakes
    - Hospital politics, rival departments and ethics fights
    - Things moving once a line is crossed
  less:
    - Everyone being calm and reasonable about him
    - The same kind of case or the same argument twice
    - Roopesh solving everything alone
