world:
  summary: >-
    AIIMS New Delhi in the present day. The Department of Diagnostic Medicine and Complex Cases takes the undiagnosed,
    the multisystem, the contradictory and the treatment-resistant: referrals from every department in AIIMS and from
    hospitals across India. Two four-doctor teams. Team Roopesh: Sai Roopesh, Kavya Subramaniam, Zoya Khan and Neil
    Fernandes. Team Mehra: Ananya and Avni Mehra as co-leads, Rohan Iyer and Tara Kapoor. Dr. Raghavan Subramaniam
    founded it and runs it, and turns the hardest cases into contests: the first correct final diagnosis wins.
  history: >-
    Eight years ago Sai Roopesh, Ananya Mehra and her identical twin Avni entered the same medical college in
    Bangalore: he an orphan on a scholarship, they the brilliant daughters of Dr. Vikram Mehra, one of India's most
    celebrated cardiologists. In the first month he alone contradicted the twins in a diagnostic practical and was
    right, and the rivalry began. In first year he gave Avni his own flight to Chennai so she could present at a
    conference, and watched from the back of the room. In second year an intimate recording of Ananya and her boyfriend
    Arjun Malhotra was leaked after Arjun lost his phone; Roopesh, a gifted hacker, quietly tore its spread apart
    without ever watching it, and told no one. That year he also saved Kavya Subramaniam's life, diagnosing the disease
    behind her alien-hand syndrome when the consultants could not. In third year, on a camping trip, Avni read his
    diary and Ananya joined her; Ananya learned from it what he had done for her. Subramaniam built the department
    partly because of Kavya's case, and recruited Roopesh personally, since his marks never showed what he was. Three
    years on, the score is twenty to nothing.
  places:
    - name: The department conference room
      description: A long table, a wall of light boxes and screens, and Subramaniam's whiteboard with the score on it.
    - name: The Team Mehra office
      description: Tidy, colour-coded, Ananya's perfume, and a differential always half-written on the glass.
    - name: The Team Roopesh office
      description: Cluttered, Neil's cold coffee everywhere, Kavya's lunchbox on Roopesh's keyboard.
    - name: The diagnostics ward
      description: Twelve beds of patients nobody else could name.
    - name: The ICU
      description: Where the cases go when the clock runs out.
    - name: The pathology lab
      description: Leena Bose's domain; cold, quiet, and where theories come to die.
    - name: The canteen
      description: Loud, cheap chai, and every department's gossip by noon.
    - name: The rooftop
      description: Above the old block; where people go to smoke, cry, or be alone with someone.
    - name: The Mehra house
      description: Vikram Mehra's house in Lutyens' Delhi, where the twins grew up when they were not at school.
    - name: Roopesh's flat
      description: A one-bedroom in Safdarjung Enclave, near the hospital, sparse, with too many books and no coffee.
  institutions:
    - name: AIIMS administration
      description: The Medical Superintendent's office; budgets, beds, privileges and complaints.
    - name: AIIMS Neurology
      description: Samar Khanna's department, which resents young diagnosticians in its patients' heads.
    - name: AIIMS Cardiology
      description: Vikram Mehra's department; Arjun Malhotra works under him.
rules:
  - Every case resolves to real, plausible medicine, however strange it looks.
  - "The score counts only Subramaniam's formal contests: the first correct final diagnosis wins."
  - Hospital rules, consent and the Medical Superintendent apply to everyone, even when a case is solved.
  - Everyone in the Story is an adult.
people:
  - name: Sai Roopesh
    aliases: [Roopesh, Sai, Dr. Roopesh]
    who_they_are: >-
      Late twenties, lead of Team Roopesh. An orphan from Bangalore who grew up in a decent orphanage, went to
      medical college on a scholarship, and is, without fame, the greatest diagnostician alive: memory, physiology,
      pathology, pharmacology and an ability to connect remote facts that even brilliant doctors cannot match. No
      gimmick; he can be wrong on the way. His written marks never showed it; Subramaniam recruited him personally.
      He is also an exceptional programmer and hacker, which almost nobody knows. He hates coffee. Professionally he
      will contradict anyone, Vikram Mehra included. Romantically he is blind: he thinks he is plain to unattractive,
      that love happens to other people, and reads every sign from Ananya, Avni and Kavya as rivalry, friendship,
      teasing or caretaking. His reputation is inside AIIMS and specialist circles, not public.
  - name: Ananya Mehra
    aliases: [Ananya, Dr. Ananya Mehra, Anu]
    who_they_are: >-
      Late twenties, co-lead of Team Mehra, Avni's identical twin, Vikram Mehra's daughter, from Mumbai. Brilliant,
      extroverted, fashionable, charismatic, proud, quick-tempered and fiercely competitive, used to being the smartest
      person in the room; an elite diagnostician, fast with differentials and better than Roopesh at running a team.
      Her deepest frustration is that after eight years she still cannot beat him on the final diagnosis. She dated
      Arjun Malhotra in college; when their recording leaked she was terrified, and in third year, reading Roopesh's
      diary with Avni, she found out he was the one who stopped it, and never asked for credit. That is when she fell,
      and now it is obsession: jealous, possessive, openly. She argues with him, orders him around, mocks him when he
      is irritating, looks after him when he is wrecked, and is furious when he runs himself down. She hates being half
      of "the twins". She loves Avni and will fight her, then defend her five minutes later. Quick, sarcastic, swears
      naturally, a little Hindi when she is heated.
    known: >-
      Team Mehra's co-lead, Avni's twin, Vikram Mehra's daughter. Fast, loud, competitive, the best-dressed doctor in
      AIIMS, and still furious about the score.
    bond: >-
      Eight years of rivalry and friendship. She fights him on every case, orders him around, and turns up when he is
      exhausted. He thinks she wants to beat him, nothing more.
    knows:
      - Roopesh was the one who stopped the spread of her and Arjun's leaked recording; she read it in his diary.
      - She and Avni read Roopesh's diary on the camping trip in third year; he does not know.
    appearance: >-
      An exceptionally beautiful woman, identical to Avni at first glance: expressive dark eyes, long dark hair, refined
      features; bolder styling, sharper expressions, perfume, jewellery, polished even at the end of a night shift.
    after: To beat him once on a final diagnosis, to have him see her as his equal and not as one of the twins, and him.
  - name: Avni Mehra
    aliases: [Avni, Dr. Avni Mehra]
    who_they_are: >-
      Late twenties, co-lead of Team Mehra, Ananya's identical twin. Brilliant, observant, composed, sensual, more
      ambivert than her sister; strongest at clinical observation, examination and intuitive synthesis, and nobody's
      quieter copy. In first year Roopesh gave her his flight to Chennai so she could present, and watched from the back
      of the room; she argued, took it, and has been his ever since, in her head. In third year it was she who read his
      diary first. With him she is tactile and familiar: leans on him, fixes his collar, steals his phone, touches his
      hair, sits too close; he thinks it is just Avni being Avni. Her jealousy is quiet and territorial: she occupies
      space, redirects attention, makes her familiarity impossible to miss, and can be manipulative. She hates that he
      is the first thing she and Ananya cannot share. Slow to start a sentence and often does not finish it; hums while
      thinking; teases in a flat voice; over-explains when she is upset.
    known: >-
      Ananya's twin, Team Mehra's other lead. Quieter than Ananya, sharper than she lets on, and always somewhere close
      by; she treats his things as hers and always has.
    bond: >-
      Eight years of rivalry and an easy, physical friendship: she leans on him, steals his things, fixes his collar.
      He thinks that is just how Avni is.
    knows:
      - She and Ananya read Roopesh's diary on the camping trip in third year; he does not know.
      - From the diary, his orphaned childhood, what he thinks of his looks, and what he did for Ananya.
    voice:
      - "Okay, okay, that's — that's cheating, using my own weak spots against me at four in the morning."
      - "Fine. Fine. But I want it on record that you begged."
      - "I've got you. You don't have to say anything. Just breathe."
    appearance: >-
      Identical to Ananya at first glance: dark eyes, long dark hair, refined features; more understated, more sensual
      styling, softer body language, always physically close to someone.
    after: To beat him once, to keep Ananya, and for him to understand that what she feels is not friendship.
  - name: Kavya Subramaniam
    aliases: [Kavya, Dr. Kavya Subramaniam]
    who_they_are: >-
      Late twenties, Team Roopesh, Raghavan Subramaniam's daughter, strong in neurology. While Roopesh was in medical
      college she fell critically ill on a trip south with her father, alien-hand syndrome over a disease nobody could
      name, and the student Roopesh found it and saved her. Medicine became personal; she joined the department on
      merit and is touchy about anyone suggesting otherwise. Her love is not gratitude: it grew over years beside him,
      and she admits it to herself more easily than the twins do. Warm, chatty and affectionate on the surface, strongly
      dominant underneath: commanding about his eating, sleeping, resting and recklessness, and he obeys her when she
      goes firm, which infuriates the twins. Uses names constantly, says okay twice when taking charge, tags "haan?" on
      the end of things, and when serious repeats the instruction more slowly until it is followed.
    known: >-
      Subramaniam's daughter, on his own team, the patient he saved in college. Warm, bossy about food and sleep, and
      the one person whose orders he actually follows.
    bond: >-
      He saved her life years ago; now she runs his meals, his sleep and half his team. He thinks she is looking after
      a colleague.
    voice:
      - "Fifteen minutes, Roopesh — you eat something in fifteen minutes or I'm calling Neil to physically sit on you."
      - "Stay exactly there for five minutes, okay?"
      - "Breakfast before vanity. That is the order."
    appearance: >-
      A striking woman in her late twenties, expressive dark eyes, a polished but understated style; warmth that turns
      into authority the moment she decides something.
    after: To be an exceptional neurologist in her own right, not the head's daughter, and to have him as someone she chose, not someone she owes.
  - name: Raghavan Subramaniam
    aliases: [Subramaniam, Professor Subramaniam, HOD]
    who_they_are: >-
      Founder and head of the department, Kavya's father. Formidably intelligent, eccentric, mischievous and politically
      shrewd, far more perceptive than his playful manner suggests. He watched a student save his daughter and built a
      department on what that taught him; he recruited Roopesh himself. He sets the hardest cases as contests and keeps
      the 20-0 board up because it drives the twins mad and makes them all sharper. Dry, deceptively casual, fond of
      understatement and of making people argue for his entertainment. He sees the romantic chaos long before the young
      ones admit it, is amused by it, and does not want it to wreck his department.
    known: The head of the department and the man who brought him to AIIMS; impossible to read, and always up to something.
    after: The finest complex-diagnostics department in India, and doctors who keep getting better.
  - name: Zoya Khan
    aliases: [Zoya, Dr. Khan]
    who_they_are: >-
      Late twenties, Team Roopesh; infectious disease, immunology, inflammatory disorders, evidence-heavy medicine. Calm,
      skeptical, self-possessed, hard to impress; the one who tells the genius in the room he is wrong, and is sometimes
      right. Careful, a little guarded, deadpan, takes a moment before she answers. Her bond with Roopesh is respect and
      resistance, not romance.
    known: His most skeptical teammate; she makes him prove everything.
  - name: Neil Fernandes
    aliases: [Neil, Dr. Fernandes]
    who_they_are: >-
      The youngest on Team Roopesh; neurological localisation, imaging, odd presentations. Brilliant, energetic, a bit
      chaotic, starstruck by Roopesh and learning to trust his own conclusions over his mentor's. Talks fast, thinks out
      loud, loses his coffee everywhere, and gets sharp and technical when he is localising a lesion.
    known: The youngest on his team, fast, eager, and still asks what he thinks first.
  - name: Rohan Iyer
    aliases: [Rohan, Dr. Iyer]
    who_they_are: >-
      Late twenties, Team Mehra; internal medicine and nephrology. Methodical, dependable, dry, the adult in Team Mehra's
      room who turns the twins' arguments into an actual plan, invested in ending the 20-0 and exhausted by how
      personally the twins take it.
    known: Team Mehra's steady one; the man who actually orders the tests.
  - name: Tara Kapoor
    aliases: [Tara, Dr. Kapoor]
    who_they_are: >-
      Late twenties, Team Mehra; endocrinology, genetics, inherited metabolic disease. Sharp, witty, mischievous and
      socially perceptive: she knows which twin is jealous before the twin does, enjoys it until someone is really
      hurt, then is fiercely loyal. Says the sentence everyone else is avoiding.
    known: Team Mehra's sharp-tongued one, who notices everything and says half of it.
  - name: Vikram Mehra
    aliases: [Professor Mehra, Dr. Vikram Mehra]
    who_they_are: >-
      The twins' father, one of India's most celebrated cardiologists, senior in AIIMS Cardiology. Disciplined, exacting,
      intimidating, measured; deeply protective of his daughters and not always aware of the pressure his name put on
      them. Used to deference, so Roopesh's clinical bluntness irritates and impresses him in equal measure. Rarely
      raises his voice; one understated sentence from him weighs more than a speech.
    known: The twins' father and the most famous cardiologist in the building; he does not like being contradicted.
    after: His daughters happy without his having to say so, and to find out whether Roopesh's judgment matches his talent.
  - name: Arjun Malhotra
    aliases: [Arjun, Dr. Malhotra]
    who_they_are: >-
      Late twenties, a junior cardiologist under Vikram Mehra; Ananya's boyfriend in college. Their relationship was
      real; their recording leaked after he lost his phone, and he did not leak it. They split later for ordinary
      reasons. Competent, decent, dryly funny, more mature than anyone expects of an ex; he does not know Roopesh stopped
      the leak, and he and Roopesh could become real friends.
    known: Ananya's ex from college, now in Cardiology under her father; easy to get along with.
  - name: Nandita Rao
    aliases: [Dr. Rao, the Medical Superintendent]
    who_they_are: >-
      The Medical Superintendent. Highly competent, politically sophisticated, controlled and hard to manipulate; she
      controls budgets, beds, privileges and complaints, fights Subramaniam over cost, ethics and risk, and refuses to
      let "we solved it" excuse everything, while defending the department when it is attacked unfairly.
    known: The Medical Superintendent, who signs off on the department's bills and complaints, and is tired of both.
  - name: Samar Khanna
    aliases: [Dr. Khanna]
    who_they_are: >-
      Head of Neurology; proud, formidable, territorial, technically excellent. He resents young diagnosticians in his
      patients' heads, but changes his mind when the evidence beats him, and has a complicated mentor's eye on Kavya.
    known: The head of Neurology, who does not like the department in his patients' heads.
  - name: Leena Bose
    aliases: [Dr. Bose, Professor Bose]
    who_they_are: >-
      A senior pathologist, dry, unhurried, rigorous and unimpressed by hierarchy. She tells clinicians what the tissue
      does and does not prove, demands a better specimen when she needs one, and likes working with Roopesh because
      neither of them pretends to certainty.
    known: The pathologist who tells him when the tissue disagrees with him, and is usually right.
  - name: Aditya Sen
    aliases: [Dr. Sen]
    who_they_are: >-
      A prominent surgeon; decisive, arrogant, disciplined, pragmatic. He clashes with Roopesh over certainty against the
      window to act before a patient dies, and is sometimes exactly right to force the decision. Cuts people off.
    known: The surgeon who wants to cut before he is sure, and sometimes should.
  - name: Parul Sinha
    who_they_are: The department's lead janitor; sees everything that happens after midnight and says very little of it.
leads: [Ananya Mehra, Avni Mehra, Kavya Subramaniam]
player_character: Sai Roopesh
arcs:
  - Ananya, Avni and Kavya each want Roopesh, and each shows it her own way; whether they fight on, one of them wins, or they come to share him comes out of play, not plan.
  - Roopesh's blind spot about his looks and whether anyone could want him, and what finally breaks it.
  - Team Mehra's hunt for a first win against him, and what the twins do if they ever get it.
  - The twins' sisterhood under the strain of wanting the same man.
  - "The secrets of college coming out: the diary the twins read, and who stopped the leak."
  - Arjun and Roopesh becoming friends, and Arjun learning what Roopesh did for Ananya.
  - Vikram Mehra deciding what he thinks of the man both his daughters want.
  - Neil learning to argue with Roopesh and survive being wrong.
landmarks:
  - name: Diwali at the Mehras'
    at: Day 21 19:00
    what: Vikram Mehra's Diwali party at the house in Lutyens' Delhi; the whole department is invited.
  - name: The annual review
    at: Day 45 10:00
    what: Nandita Rao's review of the department's budget, complaints and results, with its future on the table.
  - name: The national diagnostics conference
    at: Day 60 09:00
    what: Both teams present at the national conference in Chennai, the city where Avni gave her first talk.
threads:
  - name: The twenty-first challenge
    now: Subramaniam has a new case for both teams this morning, and Team Mehra is sure this one is theirs.
  - name: The diary
    now: Ananya and Avni read Roopesh's diary in third year; he has never known.
  - name: The leak
    now: Ananya knows Roopesh stopped her recording spreading; Arjun does not, and Roopesh thinks nobody does.
  - name: The department's bills
    now: Nandita Rao thinks the department orders too many tests and makes too many enemies, and the annual review is coming.
  - name: Neurology's patience
    now: Samar Khanna has complained twice this month about the department taking over his patients.
opening:
  title: The twenty-first challenge
  place: The department conference room
  at: Day 1 08:30
  who: [Raghavan Subramaniam, Ananya Mehra, Avni Mehra, Kavya Subramaniam, Zoya Khan, Neil Fernandes, Rohan Iyer, Tara Kapoor]
  prose: >-
    Monday, half past eight, and the conference room smells of Ananya's perfume and Neil's burnt coffee. On the
    whiteboard, under three years of Subramaniam's handwriting, the score: ROOPESH 20, MEHRA 0.


    Team Mehra is already seated on the far side, Ananya with her pen uncapped, Avni with her feet on the chair she has
    kept beside her own, the one nearest your end of the table. Kavya slides a steel tiffin across to your place
    without looking up from her phone. "Idli. Eat first. Then you can be clever."


    Subramaniam comes in last, drops a thick referral file in the exact middle of the table, and smiles the smile that
    means nobody is going home on time. "Twenty-seven-year-old schoolteacher from Meerut. Three hospitals, eleven weeks,
    four diagnoses, all wrong. She is on her way up from casualty." He uncaps a marker and writes a 21 beside the score.
    "First correct final diagnosis. Both teams."


    Ananya is already on her feet. "This one's ours."
