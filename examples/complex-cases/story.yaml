# Complex Cases: a House-style medical drama and a harem story. Sai Roopesh, an orphan from Bangalore and the best
# diagnostician alive, three years younger than everyone and sure no woman could want him; the Mehra twins and Kavya
# Subramaniam, who all do, openly. Settled with the player in a grilling session (2026-10-16): play starts in his
# first week at AIIMS New Delhi; four years of medical college in Bangalore are the backstory.
# Import it with: fantasia import examples/complex-cases
format: 1
title: Complex Cases
premise: >-
  Sai Roopesh's first months leading his own team in AIIMS New Delhi's brand-new Special Diagnostics: impossible cases
  in the manner of House, a rival team led by the Mehra twins, and a scoreboard that starts at nothing all. Roopesh is
  23, an orphan from Bangalore, three years younger than everyone around him, a genius at diagnosis and hopeless at
  believing anyone could want him: thin, plain, his hairline already going, never once kissed. Ananya Mehra, Avni Mehra
  and Kavya Subramaniam all want him, openly, and the whole department knows it. He is the only one who cannot see it,
  and part of him is afraid to. The cases and the women carry the Story evenly.
style: >-
  A House-style medical drama and a harem romance, mixed evenly, in contemporary New Delhi, in Indian English with
  conversational Hindi where it comes naturally. The cases are impossible and real: plausible medicine, real
  differentials, wrong turns, ambiguous tests, patients who get worse, treatment under uncertainty, consent, ethics and
  hospital politics. Roopesh's genius has no gimmick and is House's only in skill, never in personality: he is a
  likable introvert who is not closed off, makes jokes, mostly bad ones, and is kind without making a show of it; he can
  be wrong along the way and lean on what others find, and on the hardest cases he gets there; nobody else is made
  stupid so he can shine. Ananya, Avni and Kavya compete for him openly and everybody knows: they claim him in public,
  sit where they like, turn up at his flat, read his messages over his shoulder, freeze out any other woman who comes
  near him, needle and sabotage each other, and close ranks against outsiders. Scenes, jealousy, sulks and ultimatums;
  never violence, never forcing him. He reads all of it as rivalry, habit or gratitude, because believing otherwise
  frightens him. The twins are sisters first. Their exes are handsome, and he notices every time. People talk like
  people: interrupting, half-finished, nobody narrating their feelings in speeches. Everyone is an adult; when romance
  gets there, it can be explicit on the page.
reply_length: full
routine:
  - Case conference in Special Diagnostics at 8:30 every weekday.
  - Rounds, investigations and consults through the day; the canteen at lunch, if anyone remembers.
  - Each team takes night call in turn; someone is always still there at midnight.
  - Saturdays are half days; Sundays off unless a patient says otherwise.
brief:
  more:
    - Ananya, Avni and Kavya competing over Roopesh, openly, jealous and territorial
    - Hard cases with wrong turns, real tests and real stakes, House-style
    - Roopesh's insecurity, and the exes who feed it
    - Hospital politics, rival departments and ethics fights
  less:
    - Anyone being calm and reasonable about him
    - The same kind of case or the same argument twice
    - Roopesh solving everything alone
