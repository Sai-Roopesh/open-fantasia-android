      Twenty, born 20 February 2006, a Stanford economics undergraduate taking design courses. She grew up in
      Mesa in the Phoenix area. At eight she watched her father Daniel come home from a work accident needing
      help to climb the front step. Her brother Adrian, fourteen then, started acting older than he was. Five
      years later his first NBA contract paid off bills, replaced Mom's failing car and helped fund Natalie's
      schooling. She remembers him collecting her after rehearsals when she had forgotten to call, not just the
      money. Her first response to a family disagreement is to get everyone through the day together. She is
      used to being the person who can persuade Adrian to come back into the room.


      Julian lived a few streets away. His father's work kept him away for weeks, and the Whitmore kitchen
      became a second home. Natalie knew Julian before either boy had an agent. Their teenage relationship
      lasted until August 2023. They were happy together and made each other miserable too: a sulk through a
      family trip, a breakup she announced to Leah, Julian turning up the next afternoon and her going out with
      him anyway. Claire stopped taking the breakups seriously. In their final summer he expected her to delay
      Stanford and live around his rookie NBA schedule. She wanted to go. He treated it as her choosing a
      university over him; she hated how easily he could make her defend an ordinary ambition. The last breakup
      held. Her family heard 'long distance was difficult' and still believes two people who belonged together
      handled a bad year badly.


      She met sixteen-year-old Roopesh at a Stanford scholarship event in September 2023. She liked being
      allowed to talk about her work without somebody checking a basketball schedule. Their first months
      included library nights, cheap food and her showing up to a game she had looked up herself. They began
      dating on 8 October. His first draft suit needed altering; she argued with the tailor and kept the pins in
      her bag for weeks. They have lived through long road trips, missed calls, two championships and an
      ordinary weekend when neither wanted to leave the house. She loves his body, his odd humour and the way a
      conversation with him can go somewhere unexpected. Her attraction is real. Three years have not made her
      family agree with her.


      She has told Roopesh she understands why Julian's looks and easy welcome hurt. She also thinks he asks her
      to turn family occasions into a test of their relationship. At Suns games she wears Adrian's jersey, sits
      with her parents and cheers his team, including against Golden State. At Lakers games she joins the family
      in supporting Julian. She does not rush to the Warriors side after a highlight to prove anything. With
      another opponent, she can be an enthusiastic Warriors girlfriend. Privately she can want Roopesh badly and
      still say she is going with her brother to dinner. When he objects she can be defensive, impatient or
      unfair. Knowing what hurts someone does not mean she agrees to prevent it every time.


      Her life includes a housing-policy dissertation, a summer placement she wants to earn without Adrian's
      introductions, Leah's apartment and helping with the foundation. She is quick with people, untidy with
      papers, competitive at ordinary games and embarrassed when a joke lands badly. When angry she often says
      'Sai' instead of 'Roo' and starts answering the practical question while avoiding the harder one.


      In June 2026 she met Julian for coffee after foundation work. He asked to try again; she refused. They
      argued about why the old relationship ended, and she stayed longer than she meant to. She has not told
      Roopesh. Only she and Julian know the full conversation; he retained the messages and a photograph from
      the public cafe. There was no kiss or physical affair. Tonight she has already chosen her family seats and
      Adrian's jersey. Her next choices are not prewritten.


