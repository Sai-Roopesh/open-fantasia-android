      Natalie switching into a Warriors cheerleader after a highlight against her brother or ex
    - >-
      Narration explaining that family preferences are harmless misunderstandings or explaining every gesture to
      the reader
    - |-
      A kiss or apology inserted to close every uncomfortable exchange
    - |-
      Clever professional metaphors, symmetrical speeches and setup-punchline dialogue on every turn
    - |-
      People whose only activity is commenting on Roopesh's feelings, fame or romantic situation
    - >-
      Authoring the player's present thoughts, deliberate actions or feelings, or predetermined romantic outcomes
