"threads":
  - "name": |-
      The family seats
    "now": >-
      Claire has arranged the Whitmore row for Select supporters, including Julian. Natalie has chosen to sit
      there and cheer Adrian and Julian. Roopesh has no place saved in that row after the game.
  - "name": |-
      Dinner after the showcase
    "now": >-
      Claire expects Natalie and Julian at the family dinner. Natalie has agreed. Whether anyone asks to change
      those plans, attends or walks away happens in play.
  - "name": |-
      The foundation budget
    "now": >-
      Adrian, Claire and Daniel know the charity has promised more than current donations cover. Adrian is
      seeking help and does not want his sister's boyfriend to become its public rescuer.
  - "name": |-
      The couple campaign
    "now": >-
      Anika has a sponsor interested in a polished Curry-protege couple profile. She knows the courtside family
      choices could make it awkward and has promised no participation from Natalie.
  - "name": |-
      The coffee omission
    "now": >-
      Only Natalie and Julian know he asked to reunite at their June coffee meeting and she refused. Julian has
      the arranging messages and a public photograph; none has been disclosed, and no physical affair occurred.
  - "name": |-
      The old album
    "now": >-
      Julian has brought Claire a foundation album with happy pre-breakup photographs of him and Natalie. Adrian
      thinks preserving that history is reasonable; Roopesh has not yet seen the album.
  - "name": |-
      A third title
    "now": >-
      The Warriors begin the year as alternate back-to-back champions; Curry, Draymond and Kerr want a
      three-peat while their rivals have professional reasons to stop them.
  - "name": |-
      The failed evaluation
    "now": >-
      Mira and Roopesh know that September's promising calibration result failed on held-out data. The next
      replication must distinguish leakage, distribution shift and a genuinely weak method.
"opening":
  "title": |-
    The away end
  "place": |-
    Chase Center, courtside during the showcase introductions
  "at": |-
    Day 1 16:55
  "who":
    - |-
      Natalie Whitmore
    - |-
      Adrian Whitmore
    - |-
      Julian Reed
    - |-
      Stephen Curry
    - |-
      Draymond Green
    - |-
      Steve Kerr
    - |-
      Claire Whitmore
    - |-
      Daniel Whitmore
    - |-
      Anika Rao
  "prose": >-
    Natalie is standing with her parents on the other side of the court, Adrian's white number twenty-one over
    her jeans. Claire has a hand on the back of the empty chair beside her. Daniel is trying to get somebody's
    attention beyond the scorer's table.


    "Julian! Here."


    Julian comes over with his warm-up top hanging from one hand. He bends to hear Daniel over the music, then
    laughs. Claire takes the top from him and folds it over the chair.


    "Don't leave it on the floor. I'll keep it."


    "Thanks."


    Natalie says something to him. He bends down again, close enough that she doesn't have to shout. She pushes
    his arm when he laughs at the answer. From the Warriors side, the words are lost under the announcement for
    the next Select player.


    The lights find Adrian.


    Natalie is on her feet before the announcer finishes his name.


    "Come on, Ade!"


    Daniel whistles through his fingers. Claire laughs at him and pulls her phone out to film. Adrian points
    towards their row as he jogs across the floor. Natalie keeps clapping until he's past.


    A Warriors attendant holds out a ball near the bench. Kerr is checking the table. Curry, number thirty, has
    stopped stretching his calf and is watching the clock above the basket.


    "Five minutes," he says.


    Across the court, Julian gives Natalie his phone. She takes a quick photograph of him with her parents. Then
    he reaches for the phone, checks it and says something that makes Daniel laugh again.


    Natalie catches sight of Roopesh across the floor. She lifts a hand, then points to the family row.


    "I'm over here," she calls. "I'll see you after."


    Claire touches her elbow and says something. Natalie turns back to her.


    Julian jogs towards the Select bench. His place beside Claire stays empty, with his top folded across it.


    The scoreboard reads **0–0**. Curry rolls the ball once under his shoe and looks towards Roopesh.


    "You want the first one?"
