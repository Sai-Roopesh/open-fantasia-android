    - >-
      Plain American dialogue with contractions, uneven rhythm and subtext, and quiet stretches without
      compulsory clever jokes
    - >-
      Half basketball, half personal life, with researched NBA mechanics, Curry mentorship and meaningful
      Stanford work
  "less":
