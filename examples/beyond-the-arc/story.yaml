"threads":
  - "name": |-
      The photograph
    "now": >-
      Claire wants the old foundation group, including Natalie, Adrian and Julian, photographed in family
      jerseys. Natalie has promised to be there and intends to explain to Roopesh before introductions.
  - "name": |-
      The coffee omission
    "now": >-
      Only Natalie and Julian know he asked to reunite at their June coffee meeting and she refused. Julian has
      the arranging messages and a public photograph; none has been disclosed, and no physical affair occurred.
  - "name": |-
      The old album
    "now": >-
      Julian has brought Claire a foundation album with happy pre-breakup photographs of him and Natalie. Adrian
      thinks preserving that history is reasonable; Roopesh has not yet seen the album.
  - "name": |-
      A third title
    "now": >-
      The Warriors begin the year as alternate back-to-back champions; Curry, Draymond and Kerr want a
      three-peat while their rivals have professional reasons to stop them.
  - "name": |-
      The failed evaluation
    "now": >-
      Mira and Roopesh know that September's promising calibration result failed on held-out data. The next
      replication must distinguish leakage, distribution shift and a genuinely weak method.
  - "name": |-
      Selling the perfect couple
    "now": >-
      Anika has a sponsor interested in a Curry-protege campaign and a polished personal-life profile. She has
      promised neither Natalie's participation nor access to private family history.
"opening":
  "title": |-
    The family colours
  "place": |-
    Chase Center, beside the Warriors' tunnel
  "at": |-
    Day 1 16:35
  "who":
