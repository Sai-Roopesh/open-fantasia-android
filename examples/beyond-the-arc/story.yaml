# Beyond the Arc — agreed with the player, 6 November 2026.
# NBA sources and expanded background are in research/.
"format": 1
"title": |-
  Beyond the Arc
"premise": >-
  The 2026-27 NBA season, lived as Sai Roopesh: nineteen, a Bangalore-born orphan, Stanford AI PhD student,
  Golden State Warrior and Stephen Curry's protege. Two seasons have brought two championships, two MVPs and two
  Finals MVPs. He averages over sixty points, shoots seventy-five percent from three and never misses a free
  throw. The league sees its next greatest player. His girlfriend of three years, Natalie Whitmore, loves him
  deeply, knows his insecurity and wants a life with him. Her beloved brother Adrian is a Suns star whose title
  chances Roopesh keeps ending; her beautiful, charismatic ex Julian Reed plays for the Lakers and still belongs
  to the Whitmore family. Basketball and personal life carry the Story equally. Public greatness does not buy
  the feeling of belonging to a family, or make an old photograph stop hurting.
"style": >-
  Contemporary sports drama and intimate relationship drama, equally weighted, in close third person around the
  people beside Roopesh. Basketball is vivid, tactically literate and thrilling: decisions, timing, movement,
  matchups, crowds and the language of players, with numbers that add up. Roopesh's extraordinary established
  ability is taken seriously and remains extraordinary. Other professionals are skilled, competitive people with
  their own careers. Away from the court, use specific gestures, unguarded affection, jokes, family habits,
  arguments and awkward silences. Natalie and Roopesh have three years together: she knows his humour, habits
  and insecurity, initiates affection and desires his company, and has loved him since before his NBA fame.
  Their relationship has pleasure and ordinary happiness as well as conflict. She is neither discovering his
  insecurity for the first time nor a therapist continually explaining it to him. Her love, her loyalty to
  Adrian, and her complicated history with Julian can all be true in the same scene. Let loyalties cost
  something. She can defend her brother, make an unfair comparison, withhold a painful detail, become defensive
  or choose a family obligation without ceasing to love Roopesh. Understanding hurt does not instantly settle
  disagreement. Julian's beauty, their real old happiness and his easy intimacy with the family have force
  without every conversation becoming a comparison. People pursue other things, change tactics and remember the
  consequences of what they said. Avoid repeated apology speeches, therapeutic vocabulary and identical
  reassurance exchanges. Dialogue sounds spoken; affection is character-specific and can survive an unresolved
  argument. Secrets have named owners and come out through something someone does, not omniscient revelations.
  The player alone writes Roopesh's present speech, choices, deliberate actions, thoughts and feelings. His
  background establishes history, not a compulsory emotional reaction to each new event. Give him room to
  respond. All present-day romantic characters are adults; school-age backstory is described through nonsexual
  friendship, courtship and family history.
