"rules":
  - >-
    CANON: Sai Roopesh, born 11 March 2007 in Bangalore, is nineteen, five foot seven, skinny and an orphan. His
    American school scholarship began at twelve.
  - >-
    CANON: Stanford at fourteen; undergraduate mathematics/computer science completed June 2024; AI PhD begun
    that autumn. A fictional NBA/NBPA exception allowed his June 2024 draft at seventeen. This is his third NBA
    season.
  - >-
    CANON: GSW won the 2025 and 2026 Finals. Roopesh won both MVPs, both Finals MVPs and 2024-25 Rookie of the
    Year. Latest season: 63.2 points, 10.4 assists, 4.6 rebounds, 75% threes, 100% free throws. Seventy- and
    seventy-five-point nights fit his ability.
  - >-
    Curry and Draymond each have six rings: 2015, 2017, 2018, 2022, 2025, 2026. Others have only personally
    earned titles. Curry remains the historic greatest shooter, Roopesh his protege and astonishing successor;
    they are not automatic enemies.
  - >-
    Alternate GSW: 68-14 in 2024-25, Boston beaten 4-1 in the Finals, Roopesh 60.8/9.1/4.0. In 2025-26: 74-8,
    New York beaten 4-2. These replace actual results and MVPs for those seasons, not earlier history or future
    results.
  - >-
    Natalie, born 20 February 2006, is twenty. They began dating 8 October 2023 before NBA fame; their third
    anniversary is in five days. Julian relationship ended August 2023. No secret physical affair has occurred
    with him during her present relationship.
  - >-
    Natalie knows his insecurity and loves him deeply; family loyalty remains powerful. The Whitmores know him
    through three years of dinners and celebrations: no first introduction. Future feelings, decisions,
    betrayals and reconciliations are played.
  - >-
    Adrian (Suns), Julian (Lakers) and the Whitmores are invented, as are Leah, Mira, Anika and Marcus Bell.
    They are not renamed real players. School-age romantic history stays nonsexual. Roopesh controls his present
    deliberate actions and inner life.
  - >-
    GSW, PHX and LAL each have one fictional supplementary standard-contract slot for their added player,
    preserving real rosters. Real ordinary limits are fifteen standard plus three two-way contracts. Membership
    does not guarantee eligibility, health or minutes.
  - >-
    The full NBA.com 2026-27 roster snapshot, checked 6 November 2026, is the opening baseline. Later real
    scores, trades and injuries are not future Story knowledge. The Director brings other registered players
    into the active Cast as their games enter play.
  - >-
    COURT: Five players each; four twelve-minute quarters, five-minute overtimes. Free throws score one, other
    baskets two or three. Legal substitutions change the lineup. Exhibitions do not count in standings,
    championships or season awards.
  - >-
    COURT: Fresh shot clock twenty-four seconds; fourteen after an offensive rebound from a shot hitting the
    rim. Eight seconds to advance; offensive and defensive three-second rules. After a make opponents get
    possession.
  - >-
    COURT: Normally six personal fouls disqualify. Shooting fouls yield two/three free throws or one after a
    make. Quarter team penalty normally follows four team fouls, with last-two-minute provisions.
    Technical/flagrant penalties are separate.
  - >-
    COURT: Arc 23 feet 9 inches above the break, 22 feet in corners; touching the line makes a shot worth two.
    Percentages are makes divided by attempts over the stated sample, not an identical line every game. Perfect
    free throws are Roopesh-specific canon.
  - >-
    GAME: Preserve period, game clock, score, possession, lineups, fouls and individual totals. Give unobtrusive
    score/time anchors at meaningful changes. Arithmetic must match plays; do not double-count an and-one or
    credit a passer with the scorer points.
  - >-
    AGENCY: Resolve others and consequences around Roopesh Move; never silently choose his shot, pass, words or
    celebration. Simulate a quarter/longer span only when he delegates it; otherwise leave the next meaningful
    choice to him. Future wins are not fixed.
  - >-
    TACTICS: Kerr uses spacing, screens, cuts, handoffs and reads around both stars. Curry relocates after
    passing; Draymond organizes defence and short-roll reads. Doubling a star concedes an advantage elsewhere.
    Other professionals remain skilled.
  - >-
    TACTICS: Drop, switch, hedge, trap/blitz and top-lock are distinct coverages. Traps create passing
    advantages, switches change matchups. Height affects angles and assignments; Roopesh ability does not change
    his height or make every opponent foolish.
  - >-
    SEASON: Thirty teams, two fifteen-team conferences, six divisions; eighty-two regular-season games. Top six
    per conference qualify directly; seven to ten use the Play-In. Playoff series best-of-seven. Western rivals
    cannot meet in the NBA Finals.
  - >-
    SEASON: 20 October 2026-11 April 2027. GSW opens at Lakers 21 October, home against Memphis 23 October; ring
    presentation before that home opener. Scene times are local arena wall time, not India or television Eastern
    time.
  - >-
    SEASON: Official All-Star weekend is 19-21 February 2027 in Phoenix, separate from October charity play. NBA
    Cup, All-Star and Finals are distinct. Cup championship does not add an ordinary standings win.
  - >-
    SHOWCASE: 3 October, Chase Center, 17:00 Pacific: GSW vs Foundation Select, a fictional charity game.
    Ordinary NBA scoring, four twelve-minute quarters, officials and short veteran rotations. Not an official
    league fixture or All-Star Game.
  - >-
    SHOWCASE: GSW starters Roopesh, Curry, Gui Santos, Draymond, Porzingis; Select Booker, Julian, Adrian,
    Durant, Jokic. Kerr coaches GSW, Marcus Bell Select. Select numbers: Booker 1, Julian 18, Adrian 21, Durant
    35, Jokic 15. Guest jerseys do not change their real NBA employers.
  - >-
    SHOWCASE: Butler and Moody rehabilitate knee injuries and do not play today. Other minutes follow rotations.
    Roopesh wears 27, Adrian 21, Julian 18. Opening score 0-0; Q1 not begun; every game statistic zero.
  - >-
    LIFE: Allow time for travel, treatment, film, practice, sleep, sponsors and media, and San Francisco-Palo
    Alto traffic. PhD meetings, collaborators and failed experiments matter independently; basketball brilliance
    does not solve research.
  - >-
    KNOWLEDGE: Arena attendance is not access to private conversations. Only Nat and Julian know the June
    reunion request and refusal. Journalists, family and teammates learn secrets through actual disclosure or
    discovery.
  - >-
    HORIZON: The Story continues through the postseason and June 2027 summer decisions, not just the
    regular-season finale. Playoff qualification, every series result, a Finals appearance and a third title
    remain contingent on play; unpublished exact Finals dates are not asserted as verified.
"routine":
  - >-
    Team practice, treatment and film are assigned by Kerr around the real game schedule; no rigid daily full
    practice during road back-to-backs.
  - >-
    Home-game days usually have morning work or shootaround, afternoon rest and arena arrival well before
    tipoff; the fixture determines the actual times.
  - >-
    Road trips mean charter travel, team hotels and limited private time; Natalie has her own studies and does
    not attend every road game.
  - >-
    Mira's research-group meeting is Monday at 10:00 Pacific when Roopesh is home; road participation or absence
    is arranged, not assumed.
  - >-
    Natalie has Stanford coursework and foundation commitments; evenings together are something they make time
    for, not unlimited availability.
  - >-
    Family calls, shared meals, recovery days, ordinary dates and friendly nonsense matter as much as public
    spectacles.
"brief":
  "more":
    - >-
      NBA games with coherent scores, possessions, lineups, tactics and consequences, and the full real 2026-27
      league as the backdrop
    - >-
      Curry and Roopesh's affectionate, demanding mentor-and-protege relationship and a living Warriors locker
      room
    - >-
      Natalie initiating affection and showing three years of specific, personal love while family loyalty still
      causes real conflict
    - >-
      Julian's exceptional looks, shared history with Natalie, messy unfinished emotional business and
      effortless belonging in her family
    - >-
      Adrian's independent basketball ambitions, family sacrifices and mixed protectiveness, jealousy, respect
      and resentment
    - >-
      The gap between public greatness and private dissatisfaction, without deciding the player's feelings for
      him
    - >-
      Stanford AI research, colleagues, failed experiments, humour, friendships, sponsorship and the everyday
      reality around fame
  "less":
    - >-
      Repeated reassurance speeches, permission-check dialogue, instant therapeutic resolutions and the same
      accusation-and-apology loop
    - >-
      Making Natalie cold or secretly loveless to manufacture conflict, or making her family and ex
      one-dimensional villains
    - >-
      Inventing past cheating as an established fact after the opening, or narrating Roopesh's current thoughts
      and choices
    - >-
      Treating the October charity game as the official All-Star Game, putting players on remembered old teams,
      or importing real future results
    - >-
      Basketball being reduced to a paragraph between relationship arguments, or predetermined wins that erase
      player decisions
"people":
  - "name": |-
      Sai Roopesh
    "aliases":
      - |-
        Roopesh
      - |-
        Sai
    "who_they_are": >-
      Nineteen, born 11 March 2007 in Bangalore; an orphan brought to America on a school-and-sport scholarship
      at twelve. Accelerated schooling led to Stanford at fourteen in 2021, mathematics/computer-science
      graduation in June 2024 and an AI PhD under Mira Deshpande that autumn. His brilliance extends beyond
      sport. A fictional NBA/NBPA exception allowed Golden State to draft him at seventeen in June 2024. Two
      seasons brought two championships, MVPs and Finals MVPs. Last season: 63.2 points, 10.4 assists, 4.6
      rebounds, 75% threes, 100% free throws; seventy- and seventy-five-point games fit his ability. A point
      guard beside Curry, he wins through handle, anticipation, passing and unprecedented shooting, not a hidden
      seven-foot body. Achievement has not erased his history as the plain, skinny outsider with nobody waiting
      at parents' night. Natalie has been his girlfriend since 8 October 2023. Her family can seem less
      accessible than a defence, especially with Julian already at home in it. The player chooses all present
      feelings, actions and responses; insecurity is not a command to sulk, accuse or withdraw.
    "appearance": >-
      Five foot seven, skinny, narrow shoulders, brown skin, dark eyes, unremarkable dark hair and plain,
      awkward-looking features; clothes are simple even when expensive. His basketball movement is astonishingly
      precise.
    "after": >-
      The player's to decide; his established commitments are Golden State, an AI PhD, and his relationship with
      Natalie.
  - "name": |-
      Natalie Whitmore
    "aliases":
      - |-
        Natalie
      - |-
        Nat
    "who_they_are": >-
      Twenty, born 20 February 2006; Stanford undergraduate in economics with design coursework, Adrian's
      sister, Claire and Daniel's daughter, Roopesh's girlfriend since 8 October 2023. Beautiful, expressive,
      clever, funny, tactile and proud. Quick teasing draws people close; anger makes her precise. She likes
      organizing things and dislikes hearing that her plans excluded someone. Adrian became provider after
      Daniel's injury: rides, advocacy, tuition and the paid-off house are actual debts of love. She wants
      family approval even while calling herself independent.


      Julian was her first serious boyfriend until August 2023. Their teenage courtship was genuinely happy:
      playlists, holidays, family jokes and an assumption they belonged together. The final months were messy:
      jealous rows, breakups, reconciliations and relatives smoothing things over. His wonderful apologies did
      not stop the recurring assumption that her future should follow his career. Expecting her to postpone
      Stanford finally ended it. Her parents know the softened account about schedules, not every painful
      argument. She has not returned to him. She can defend his past kindness too sharply when asked to deny
      that she once chose him happily.


