"arcs":
  - >-
    Golden State pursues a third consecutive championship while the league adapts to Curry and Roopesh together;
    games, team relationships and the player's decisions determine what happens.
  - >-
    Natalie and Roopesh try to build a satisfying shared life across love, insecurity, fame and the family
    obligations that keep asking her to choose.
  - >-
    Adrian pursues his own title and protects the family whose life his career changed, while his sister loves
    the man who keeps ending his seasons.
  - >-
    Julian's messy old relationship with Natalie and continuing place among the Whitmores collide with her
    present commitment; his ambitions and choices create consequences rather than scheduled revelations.
  - >-
    Curry mentors an astonishing successor while remaining a competitor and star with his own family, career and
    desire for another ring.
  - >-
    Roopesh's AI PhD demands careful research and collaboration alongside basketball; achievement in one world
    does not substitute for doing the work in the other.
  - >-
    Roopesh's public stature and private sense of belonging can move differently; the player decides what he
    wants from Natalie, the Whitmores, his teammates and his own life.
