  "prose": >-
    The main scoreboard still reads **WARRIORS 0 — FOUNDATION SELECT 0**. Beneath it, the ribbon board rolls
    through scholarship recipients' names. Twenty-five minutes until tipoff; the floor belongs to warm-ups,
    squeaking shoes and the steady bounce of more than one ball.


    On the courtside rail, a boy holds up a handmade sign: **SIX RINGS FOR STEPH. TWO FOR SAI. ONE MORE
    TOGETHER.**


    Curry spots it on his way past the tunnel and laughs.


    “Ambitious little accountant.” He flicks a glance towards Draymond. “I'm keeping him away from contract
    negotiations.”


    “Kid's got a plan,” Draymond says. “More than some people.”


    Across the court, Booker waits for a return pass while Jokic talks to one of the Select coaches. Durant is
    taking his time at the elbow. Their temporary white jerseys belong to tonight's charity game; the Suns,
    Nuggets, Rockets and the rest of the league will have them back tomorrow. Kerr stands near the scorer's
    table discussing the first substitutions.


    Then Natalie appears from the hospitality corridor.


    Her hair is loose, her smile already there. She is wearing Adrian's number twenty-one.


    The thin silver bracelet at her wrist is familiar: the one from her last anniversary with Roopesh. She
    touches it as she approaches, holding up her other hand before she is close enough to be heard by the
    spectators.


    “Hi. I've been trying to escape my mother for twenty minutes.”


    Behind her, Claire is directing a photographer beside a display of old foundation pictures. Daniel has an
    album open. Julian stands at his shoulder in Select's number eighteen, effortlessly handsome even with a
    towel around his neck.


    Daniel laughs at something on the page.


    “I'd forgotten that kitchen.”


    “Nat didn't speak to me until we'd replaced the cake,” Julian says. “Your wife still says it was my fault.”


    “It was your fault,” Natalie calls back automatically. Her mouth curves at the memory; then she turns to
    Roopesh again.


    “I wanted to find you before—”


    “Nat.” Adrian has come over from the Select bench. He stops beside her, glancing towards the waiting camera.
    “Two minutes. Mum's finally got everyone.”


    Natalie looks back at the photographer, then at her brother.


    “I said I'd do it, Ade. Give me a second.”


    Adrian's expression tightens a fraction. Julian has closed the album and is carrying it towards Claire. He
    knows where to stand without being asked.


    Natalie steps a little closer to Roopesh. Her voice drops; the family cannot hear it now.


    “It's his foundation game. I promised the jersey and the photograph.” She glances down at the white
    twenty-one, then meets him directly. “I know why this is awkward. I wanted you to hear it from me.”


    Her hand opens between them, near enough to take, while the photographer asks the Whitmores to move closer
    together.
