<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editing the Story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9A4FF;text-decoration:none}a:hover{color:#D6C9FF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#141218;color:#EEEAF4;font-family:Manrope,system-ui,sans-serif;overflow:hidden">
  <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px;padding:72px 20px 0">
    <span style="font-size:12px;font-weight:700;letter-spacing:0.1em;color:#8E879C">LANDMARKS</span>
    <div style="height:64px;border-radius:16px;background:#1E1B24;border:1px solid #2E2A36"></div>
    <div style="height:88px;border-radius:16px;background:#1E1B24;border:1px solid #2E2A36"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(8,6,12,0.66)"></div>

  <section role="dialog" aria-labelledby="edit-title" style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:16px;padding:12px 20px 24px;border-radius:24px 24px 0 0;background:#1E1B24;border-top:1px solid #34303D">
    <span aria-hidden="true" style="align-self:center;width:36px;height:4px;border-radius:2px;background:#3A3544"></span>
    <div style="display:flex;flex-direction:column;gap:4px">
      <h2 id="edit-title" style="margin:0;font-family:Literata,Georgia,serif;font-size:21px;font-weight:600">Draconia's flying test</h2>
      <span style="font-size:13px;line-height:1.5;color:#B3ACC0">The World brings it about at its time, whether or not the Arcs are ready. From now on, on this Path.</span>
    </div>
    <div style="display:flex;gap:10px">
      <label style="flex:1;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:600;color:#B3ACC0">Day</span>
        <span style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;border:1px solid #7552DD;background:#141218">
          <input value="68" inputmode="numeric" style="width:48px;border:0;background:none;color:#EEEAF4;font-family:Manrope,system-ui,sans-serif;font-size:15px">
          <span style="font-size:13px;color:#8E879C">Friday</span>
        </span>
      </label>
      <label style="flex:1;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:13px;font-weight:600;color:#B3ACC0">Time</span>
        <button style="height:48px;padding:0 14px;border-radius:14px;border:1px solid #3A3544;background:#141218;color:#EEEAF4;font-size:15px;text-align:left">10:00 am</button>
      </label>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:600;color:#B3ACC0">What happens</span>
      <textarea rows="3" style="resize:none;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:1px solid #3A3544;background:#141218;color:#EEEAF4;font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45">Madam Hooch tests the first-years. Her father is watching.</textarea>
    </label>
    <span role="alert" style="display:none;font-size:13px;line-height:1.5;color:#E9B95C">That time has passed on this Path.</span>
    <div style="display:flex;gap:10px;align-items:center;margin-top:4px">
      <button style="height:48px;padding:0 16px;border:0;border-radius:24px;background:none;color:#E9B95C;font-size:15px">Drop</button>
      <span style="flex:1"></span>
      <a href="Story.dc.html" style="display:flex;align-items:center;height:48px;padding:0 20px;border-radius:24px;color:#B3ACC0;font-size:15px">Cancel</a>
      <a href="Story.dc.html" style="display:flex;align-items:center;height:48px;padding:0 24px;border-radius:24px;background:#7552DD;color:#FFFFFF;font-weight:600;font-size:15px">Save</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
