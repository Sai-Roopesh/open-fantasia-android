schema: spec-driven

context: |
  Open Fantasia is one player's roleplay app. Two parts and the contract between them:
  - host/: the Mac server in TypeScript. It owns every Story (docs/adr/0001) and runs the five agents.
  - android/: the phone app in Kotlin and Jetpack Compose, a thin client.
  - protocol/: the phone-to-Mac contract, defined once as a schema; the Kotlin types are generated from it.
  CONTEXT.md is the glossary; every artifact uses its terms and avoids the words it lists under Avoid.
  docs/adr/ holds the decisions; cite them by number. An ADR can be superseded by a newer one, never edited silently.
  Stories are made outside the app as Story Files (docs/adr/0002).
  docs/design/ holds the approved screens (README.md says which file is which); phone work builds to them.

rules:
  specs:
    - Use CONTEXT.md terms in bold capitals, exactly as the glossary spells them.
    - Every requirement has a body line with SHALL and at least one scenario in GIVEN/WHEN/THEN bullets.
    - Describe behaviour the player can check, never classes, tables or prompts.
  design:
    - Say for each part whether it lands in host, android or protocol.
    - Phone work names the docs/design screens it builds, and builds them as drawn.
    - A decision that is hard to reverse, surprising and the result of a real trade-off becomes a new ADR in docs/adr/.
  tasks:
    - Every scenario gets a task that writes its test first and names the scenario it proves.
    - A test is never changed to make code pass; when a test is wrong, the spec changes first, then the test.

operations:
  apply:
    guidance:
      - Write the scenario's test first and watch it fail before writing the code that passes it.
      - Tests quote the scenario they prove by its requirement and scenario name.
